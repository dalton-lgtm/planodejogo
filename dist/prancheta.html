};

// Em aba privada, em arquivo local ou com o armazenamento bloqueado, até
// o simples acesso a localStorage estoura. Entao tudo passa por aqui.
PJ.semMemoria = false;

function ler(chave) {
  try { return window.localStorage.getItem(chave); } catch (err) { PJ.semMemoria = true; return null; }
}
function escrever(chave, valor) {
  try {
    window.localStorage.setItem(chave, valor);
    return true;
  } catch (err) {
    var cota = err && (err.name === 'QuotaExceededError' ||
      err.name === 'NS_ERROR_DOM_QUOTA_REACHED' || err.code === 22 || err.code === 1014);
    if (cota) return 'cheio';
    PJ.semMemoria = true;
    return false;
  }
}

function interpretar(bruto, chave) {
  if (!bruto) return null;
  try {
    var lido = JSON.parse(bruto);
    if (lido && Array.isArray(lido.elenco) && lido.elenco.length && lido.campos) return lido;
  } catch (err) {
    // guarda o que não deu para ler, em vez de jogar fora sem avisar
    if (chave) escrever(chave + '.ilegivel', bruto);
  }
  return null;
}

PJ.deOndeVeio = '';

PJ.carregar = function () {
  var lido = interpretar(ler(PJ.CHAVE), PJ.CHAVE);
  if (lido) PJ.deOndeVeio = 'principal';

  // o arquivo principal falhou: tenta a segunda via gravada junto com ele
  if (!lido) {
    lido = interpretar(ler(PJ.CHAVE_COPIA), PJ.CHAVE_COPIA);
    if (lido) PJ.deOndeVeio = 'copia';
  }

  // ainda nada: procura o time guardado por uma versão anterior
  if (!lido) {
    for (var i = 0; i < PJ.CHAVES_ANTIGAS.length && !lido; i++) {
      lido = interpretar(ler(PJ.CHAVES_ANTIGAS[i]), null);
      if (lido) PJ.deOndeVeio = 'antiga';
    }
  }

  if (lido) {
    PJ.estado = PJ.sanear(PJ.completar(lido));
    return false; // não é a primeira vez
  }
  PJ.deOndeVeio = 'novo';
  PJ.estado = PJ.estadoNovo();
  return true; // primeira vez
};

// Vasculha o aparelho atrás de qualquer time guardado por este aplicativo,
// inclusive de versões antigas e de gravações que deram errado.
PJ.procurarTimes = function () {
  var achados = [];
  try {
    for (var i = 0; i < window.localStorage.length; i++) {
      var chave = window.localStorage.key(i);
      if (!chave || chave.indexOf('planodejogo') !== 0) continue;
      var lido = interpretar(window.localStorage.getItem(chave), null);
      if (!lido) continue;
      achados.push({
        chave: chave,
        nome: String(lido.nomeTime || 'Time sem nome'),
        quantos: lido.elenco.length,
        proprios: lido.elenco.filter(function (j) { return !j.exemplo; }).length,
        quando: lido.atualizadoEm || '',
        emUso: chave === PJ.CHAVE,
        dados: lido,
      });
    }
  } catch (err) { /* armazenamento bloqueado */ }
  return achados;
};

// Não deixa número estragado entrar: x ou y virando NaN faz o jogador
// sumir da tela sem nenhum aviso.
PJ.sanear = function (e) {
  var num = function (v, padrao) {
    var n = Number(v);
    return Number.isFinite(n) ? PJ.limitar(n, 0, 100) : padrao;
  };
  PJ.ORDEM_MODALIDADES.forEach(function (id) {
    var c = e.campos[id];
    c.emCampo.forEach(function (p) {
      p.x = num(p.x, 50);
      p.y = num(p.y, 50);
      delete p.sigla;
    });
    c.adversarios = c.adversarios.filter(function (a) {
      a.x = num(a.x, 50); a.y = num(a.y, 50);
      return true;
    });
    c.setas = c.setas.filter(function (s) {
      if (!s || !Array.isArray(s.pontos) || s.pontos.length < 2) return false;
      s.pontos = s.pontos.map(function (p) { return [num(p[0], 50), num(p[1], 50)]; });
      return true;
    });
    if (c.base) {
      c.base.forEach(function (p) { p.x = num(p.x, 50); p.y = num(p.y, 50); });
    }
  });
  e.elenco.forEach(function (j) {
    if (!PJ.POSICOES[j.posicao]) j.posicao = 'MEI';
    j.nome = String(j.nome == null ? 'Jogador' : j.nome).slice(0, 40) || 'Jogador';
    var n = parseInt(j.numero, 10);
    j.numero = Number.isFinite(n) ? PJ.limitar(n, 0, 99) : 0;
  });
  return e;
};

// Preenche o que faltar em um estado antigo, para uma versão nova do
// aplicativo nunca quebrar o time de ninguém.
PJ.completar = function (e) {
  var base = PJ.estadoNovo();
  if (typeof e.nomeTime !== 'string') e.nomeTime = base.nomeTime;
  if (!PJ.MODALIDADES[e.modalidade]) e.modalidade = 'campo11';
  if (!Array.isArray(e.elenco) || !e.elenco.length) e.elenco = base.elenco;
  if (!e.campos) e.campos = {};
  if (typeof e.proximoId !== 'number') e.proximoId = e.elenco.length + 1;
  if (!Array.isArray(e.taticas)) e.taticas = [];
  // o capitão tem que ser alguém que ainda está no time
  if (e.capitao && !e.elenco.some(function (j) { return j.id === e.capitao; })) e.capitao = null;
  if (!Array.isArray(e.comissao)) {
    e.comissao = PJ.CARGOS_PADRAO.map(function (cargo) { return { cargo: cargo, nome: '' }; });
  }
  e.comissao = e.comissao.filter(function (c) { return c && typeof c.cargo === 'string'; })
    .map(function (c) {
      return { cargo: String(c.cargo).slice(0, 30), nome: String(c.nome || '').slice(0, 40) };
    }).slice(0, 12);
  if (!e.jogo) e.jogo = base.jogo;
  if (!Array.isArray(e.jogo.registro)) e.jogo.registro = [];
  if (typeof e.dicas !== 'number') e.dicas = 99;
  if (typeof e.tela !== 'string') e.tela = 'auto';
  e.elenco.forEach(function (j) {
    if (!PJ.POSICOES[j.posicao]) j.posicao = 'MEI';
  });
  // Marca jogador por jogador quem ainda é do time de exemplo. Quem o
  // treinador renomeou, renumerou ou mudou de posição JAMAIS é marcado —
  // é time dele e não pode sumir por causa de uma limpeza automática.
  var temMarca = e.elenco.some(function (j) { return typeof j.exemplo === 'boolean'; });
  if (!temMarca) {
    e.elenco.forEach(function (j, i) {
      var molde = PJ.ELENCO_EXEMPLO[i];
      j.exemplo = !!(e.exemplo && molde && j.nome === molde.nome);
      // quem ainda é de exemplo recebe a numeração corrigida
      if (j.exemplo) j.numero = molde.numero;
    });
  }
  e.exemplo = e.elenco.some(function (j) { return j.exemplo; });
  PJ.ORDEM_MODALIDADES.forEach(function (id) {
    var c = e.campos[id];
    if (!c || !Array.isArray(c.emCampo)) {
      e.campos[id] = campoVazio(id, e.elenco);
      return;
    }
    if (!Array.isArray(c.setas)) c.setas = [];
    if (!Array.isArray(c.adversarios)) c.adversarios = [];
    if (typeof c.estilo !== 'string') c.estilo = 'padrao';
    // tira jogador que não existe mais no elenco
    c.emCampo = c.emCampo.filter(function (p) {
      return e.elenco.some(function (j) { return j.id === p.id; });
    });
  });
  return e;
};

function gravarAgora() {
  if (agendaSalvar) { window.clearTimeout(agendaSalvar); agendaSalvar = null; }
  PJ.estado.atualizadoEm = new Date().toISOString();
  var texto = JSON.stringify(PJ.estado);
  var r = escrever(PJ.CHAVE, texto);
  if (r === 'cheio') {
    // faz espaço tirando o que é descartável, nunca o elenco
    PJ.estado.jogo.registro = PJ.estado.jogo.registro.slice(-20);
    PJ.estado.taticas = PJ.estado.taticas.slice(-20);
    texto = JSON.stringify(PJ.estado);
    r = escrever(PJ.CHAVE, texto);
  }
  // segunda via: se a gravação principal se perder, o time continua aqui
  if (r === true) escrever(PJ.CHAVE_COPIA, texto);
  PJ.avisarSalvo(r === true);
}

PJ.salvar = function () {
  if (agendaSalvar) window.clearTimeout(agendaSalvar);
  agendaSalvar = window.setTimeout(gravarAgora, 300);
};

// O celular pode ir para segundo plano a qualquer momento: grava na hora.
PJ.ligarGravacaoSegura = function () {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') gravarAgora();
  });
  window.addEventListener('pagehide', gravarAgora);
};

// ------------------------------------------------------------- desfazer

PJ.antes = function (rotulo) {
  pilhaDesfazer.push({ rotulo: rotulo, estado: copia(PJ.estado) });
  if (pilhaDesfazer.length > LIMITE_DESFAZER) pilhaDesfazer.shift();
  PJ.atualizarDesfazer();
};

PJ.temDesfazer = function () {
  return pilhaDesfazer.length > 0;
};

PJ.ultimoRotulo = function () {
  return pilhaDesfazer.length ? pilhaDesfazer[pilhaDesfazer.length - 1].rotulo : '';
};

PJ.desfazer = function () {
  if (!pilhaDesfazer.length) return null;
  var passo = pilhaDesfazer.pop();
  PJ.estado = passo.estado;
  PJ.salvar();
  PJ.atualizarDesfazer();
  return passo.rotulo;
};

// -------------------------------------------------------------- atalhos

PJ.campo = function () {
  return PJ.estado.campos[PJ.estado.modalidade];
};

PJ.modalidade = function () {
  return PJ.MODALIDADES[PJ.estado.modalidade];
};

PJ.jogadorPorId = function (id) {
  for (var i = 0; i < PJ.estado.elenco.length; i++) {
    if (PJ.estado.elenco[i].id === id) return PJ.estado.elenco[i];
  }
  return null;
};

PJ.estaEmCampo = function (id) {
  return PJ.campo().emCampo.some(function (p) { return p.id === id; });
};

PJ.banco = function () {
  return PJ.estado.elenco.filter(function (j) { return !PJ.estaEmCampo(j.id); });
};

// Sugere a camisa que combina com a posição: o lateral-esquerdo nasce 6,
// o direito 2, o volante 5. Se o número já estiver com alguém, cai para a
// segunda opção e depois para o primeiro livre.
PJ.numeroParaPosicao = function (sigla) {
  var pos = PJ.POSICOES[sigla];
  if (!pos) return PJ.proximoNumero();
  var usados = {};
  PJ.estado.elenco.forEach(function (j) { usados[j.numero] = true; });
  if (pos.camisa && !usados[pos.camisa]) return pos.camisa;
  if (pos.camisa2 && !usados[pos.camisa2]) return pos.camisa2;
  return PJ.proximoNumero();
};

// Quantos nomes de exemplo ainda estão na lista, sem ninguém ter mexido.
PJ.ehCapitao = function (id) {
  return !!id && PJ.estado.capitao === id;
};

// Um capitão só: escolher outro passa a faixa.
PJ.definirCapitao = function (id) {
  PJ.antes('capitão do time');
  PJ.estado.capitao = PJ.estado.capitao === id ? null : id;
  PJ.marcarComoMeu(PJ.jogadorPorId(id));
};

PJ.quantosDeExemplo = function () {
  return PJ.estado.elenco.filter(function (j) { return j.exemplo; }).length;
};

// Qualquer mexida num jogador faz dele um jogador do treinador.
PJ.marcarComoMeu = function (j) {
  if (j) j.exemplo = false;
};

PJ.proximoNumero = function () {
  var usados = {};
  PJ.estado.elenco.forEach(function (j) { usados[j.numero] = true; });
  for (var n = 1; n < 100; n++) if (!usados[n]) return n;
  return 0;
};

// ----------------------------------------- formações, vagas e estilos

PJ.limitar = function (v, min, max) {
  return Math.max(min, Math.min(max, v));
};

PJ.ehGoleiro = function (idJogador) {
  var j = PJ.jogadorPorId(idJogador);
  return !!(j && j.posicao === 'GOL');
};

// Encaixa quem ESTÁ em campo agora nas vagas de um desenho. Ninguém entra,
// ninguém sai: cada jogador vai para a vaga mais perto de onde já estava,
// com preferência para a vaga da posição dele.
PJ.encaixarNasVagas = function (vagas) {
  var c = PJ.campo();
  var sobrando = c.emCampo.slice();
  var pares = [];
  vagas.forEach(function (v, iv) {
    sobrando.forEach(function (p, ip) {
      var j = PJ.jogadorPorId(p.id) || {};
      var mesma = j.posicao === v.sigla ? 0 : 1;
      var d = Math.sqrt(Math.pow(p.x - v.x, 2) + Math.pow(p.y - v.y, 2));
      pares.push({ iv: iv, ip: ip, custo: mesma * 22 + d });
    });
  });
  pares.sort(function (a, b) { return a.custo - b.custo; });

  var vagaOcupada = {};
  var jaColocado = {};
  var novo = [];
  pares.forEach(function (par) {
    if (vagaOcupada[par.iv] || jaColocado[par.ip]) return;
    vagaOcupada[par.iv] = true;
    jaColocado[par.ip] = true;
    var v = vagas[par.iv];
    var p = sobrando[par.ip];
    novo.push({ id: p.id, x: v.x, y: v.y });
    var j = PJ.jogadorPorId(p.id);
    if (j && !PJ.POSICOES[j.posicao]) j.posicao = v.sigla;
  });
  // se houver mais gente em campo que vagas, quem sobrou fica onde estava
  sobrando.forEach(function (p, ip) { if (!jaColocado[ip]) novo.push(p); });

  c.emCampo = novo;
  c.base = null;
  return vagas.length - novo.filter(function (p, i) { return i < vagas.length; }).length;
};

PJ.formacaoPorId = function (id) {
  var m = PJ.modalidade();
  for (var i = 0; i < m.formacoes.length; i++) if (m.formacoes[i].id === id) return m.formacoes[i];
  return m.formacoes[0];
};

PJ.vagasDaFormacao = function (f) {
  return f.jogadores.map(function (slot) {
    return { sigla: slot[0], x: slot[1], y: slot[2] };
  });
};

PJ.aplicarFormacao = function (idFormacao) {
  var c = PJ.campo();
  var f = PJ.formacaoPorId(idFormacao);
  PJ.encaixarNasVagas(PJ.vagasDaFormacao(f));
  c.formacao = f.id;
  c.estilo = 'padrao';
};

// Afasta quem ficou colado depois de mexer no time todo de uma vez.
// A conta leva em conta que o campo é mais alto do que largo.
function afastarColados(lista, m) {
  var minimo = 17;
  var borda = m.margemLateral;
  for (var passo = 0; passo < 2; passo++) {
    for (var a = 0; a < lista.length; a++) {
      for (var b = a + 1; b < lista.length; b++) {
        var pa = lista[a];
        var pb = lista[b];
        var dx = pa.x - pb.x;
        var dy = (pa.y - pb.y) / m.proporcao;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d >= minimo) continue;
        var falta = (minimo - d) / 2;
        var sinal = dx === 0 ? (a % 2 === 0 ? 1 : -1) : (dx > 0 ? 1 : -1);
        pa.x = PJ.limitar(pa.x + sinal * falta, borda, 100 - borda);
        pb.x = PJ.limitar(pb.x - sinal * falta, borda, 100 - borda);
      }
    }
  }
}

// O estilo de jogo mexe o time inteiro de uma vez, sempre a partir do
// desenho guardado, para o efeito nunca acumular.
PJ.aplicarEstilo = function (idEstilo) {
  var c = PJ.campo();
  var m = PJ.modalidade();
  var est = PJ.estiloPorId(idEstilo);
  if (!c.base) c.base = copia(c.emCampo);

  var linha = c.base.filter(function (p) { return !PJ.ehGoleiro(p.id); });
  if (!linha.length) { c.estilo = idEstilo; return; }
  var centro = linha.reduce(function (soma, p) { return soma + p.y; }, 0) / linha.length;

  // quem é o homem da frente, para o contra-ataque esticar só ele
  var naFrente = {};
  if (est.esticaFrente) {
    var quantos = m.emCampo >= 7 ? 2 : 1;
    linha.slice().sort(function (a, b) { return b.y - a.y; }).slice(0, quantos)
      .forEach(function (p) { naFrente[p.id] = true; });
  }

  c.emCampo = c.base.map(function (p) {
    var novo = { id: p.id, x: p.x, y: p.y };
    if (PJ.ehGoleiro(p.id)) {
      novo.y = PJ.limitar(p.y + est.desloca * 0.3, 6, 45);
      return novo;
    }
    novo.x = PJ.limitar(50 + (p.x - 50) * est.abre, m.margemLateral, 100 - m.margemLateral);
    var y = centro + (p.y - centro) * est.compacta + est.desloca;
    if (naFrente[p.id]) y += est.esticaFrente;
    novo.y = PJ.limitar(y, 8, m.alturaMaxima);
    return novo;
  });

  afastarColados(c.emCampo, m);
  c.estilo = idEstilo;
};

// Quando o treinador arrasta alguém na mão, o desenho guardado passa a ser
// o que está na tela: o próximo estilo parte dali.
PJ.fixarComoBase = function () {
  PJ.campo().base = copia(PJ.campo().emCampo);
};

/* ===== 20-campo.js ===== */
// Desenha o campo. As mesmas figuras servem para a tela (SVG) e para a
// foto que o treinador manda no WhatsApp (canvas) — a conta e uma só.

PJ.LINHA_FINA = 0.8;   // espessura em % da largura do campo
PJ.LINHA_MEIO = 1.15;  // a linha do meio e mais grossa, igual ao desenho a mão

// Converte a coordenada do campo (y=0 no nosso gol) para a do desenho,
// onde o y cresce para baixo.
PJ.paraDesenho = function (m, x, y) {
  return [x, ((100 - y) * m.alturaVB) / 100];
};

function numero(n) {
  return Math.round(n * 1000) / 1000;
}

PJ.campoEmSVG = function (m) {
  var s = [];
  var conv = function (x, y) { return PJ.paraDesenho(m, x, y); };
  var raioY = function (r) { return (r * m.alturaVB) / 100; };

  m.figuras.forEach(function (fig) {
    if (fig.tipo === 'retangulo') {
      var a = conv(fig.x, fig.y + fig.altura);
      s.push('<rect x="' + numero(a[0]) + '" y="' + numero(a[1]) +
        '" width="' + numero(fig.largura) + '" height="' + numero(raioY(fig.altura)) +
        '" class="cal"/>');
    } else if (fig.tipo === 'linha') {
      var p1 = conv(fig.x1, fig.y1);
      var p2 = conv(fig.x2, fig.y2);
      s.push('<line x1="' + numero(p1[0]) + '" y1="' + numero(p1[1]) +
        '" x2="' + numero(p2[0]) + '" y2="' + numero(p2[1]) +
        '" class="' + (fig.papel === 'meio' ? 'cal meio' : 'cal') + '"/>');
    } else if (fig.tipo === 'circulo') {
      var c = conv(fig.cx, fig.cy);
      s.push('<circle cx="' + numero(c[0]) + '" cy="' + numero(c[1]) +
        '" r="' + numero(fig.r) + '" class="cal' + (fig.papel === 'fraco' ? ' fraca' : '') + '"/>');
    } else if (fig.tipo === 'disco') {
      var d = conv(fig.cx, fig.cy);
      s.push('<circle cx="' + numero(d[0]) + '" cy="' + numero(d[1]) +
        '" r="' + numero(fig.r) + '" class="calCheia"/>');
    } else if (fig.tipo === 'poligonal') {
      var pts = fig.pontos.map(function (p) {
        var q = conv(p[0], p[1]);
        return numero(q[0]) + ',' + numero(q[1]);
      }).join(' ');
      s.push('<polyline points="' + pts + '" class="cal"/>');
    } else if (fig.tipo === 'gol') {
      // a boca do gol é desenhada por DENTRO da linha de fundo: assim ela
      // aparece inteira em qualquer tela, sem ser cortada pela borda
      var fundo = conv(0, fig.y)[1];
      var dentroY = fig.dentro > 0 ? fundo - raioY(2.4) : fundo + raioY(2.4);
      var topo = Math.min(fundo, dentroY);
      var alt = Math.abs(dentroY - fundo);
      s.push('<rect x="' + numero(fig.x1) + '" y="' + numero(topo) +
        '" width="' + numero(fig.x2 - fig.x1) + '" height="' + numero(alt) + '" class="gol"/>');
      for (var i = 1; i < 5; i++) {
        var gx = fig.x1 + ((fig.x2 - fig.x1) * i) / 5;
        s.push('<line x1="' + numero(gx) + '" y1="' + numero(topo) +
          '" x2="' + numero(gx) + '" y2="' + numero(topo + alt) + '" class="rede"/>');
      }
    }
  });
  return s.join('');
};

PJ.montarCampoSVG = function (svg, m) {
  svg.setAttribute('viewBox', '0 0 100 ' + numero(m.alturaVB));
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = PJ.campoEmSVG(m);
};

// ----------------------------------------------------- foto para o WhatsApp

PJ.desenharCampoCanvas = function (ctx, ox, oy, larg, alt, m, cores) {
  var conv = function (x, y) {
    return [ox + (x / 100) * larg, oy + ((100 - y) / 100) * alt];
  };
  var u = larg / 100; // 1 unidade do campo em pixels

  ctx.save();
  ctx.fillStyle = cores.grama;
  ctx.fillRect(ox, oy, larg, alt);
  if (m.superficie === 'grama') {
    ctx.fillStyle = cores.gramaFaixa;
    for (var k = 0; k < 8; k += 2) {
      ctx.fillRect(ox, oy + (alt * k) / 8, larg, alt / 8);
    }
  }

  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  m.figuras.forEach(function (fig) {
    ctx.strokeStyle = fig.papel === 'meio' ? cores.meio : cores.cal;
    ctx.fillStyle = cores.cal;
    ctx.lineWidth = (fig.papel === 'meio' ? PJ.LINHA_MEIO : PJ.LINHA_FINA) * u;
    ctx.globalAlpha = fig.papel === 'fraco' ? 0.45 : 1;
    ctx.beginPath();
    if (fig.tipo === 'retangulo') {
      var a = conv(fig.x, fig.y + fig.altura);
      ctx.rect(a[0], a[1], fig.largura * u, (fig.altura / 100) * alt);
      ctx.stroke();
    } else if (fig.tipo === 'linha') {
      var p1 = conv(fig.x1, fig.y1);
      var p2 = conv(fig.x2, fig.y2);
      ctx.moveTo(p1[0], p1[1]);
      ctx.lineTo(p2[0], p2[1]);
      ctx.stroke();
    } else if (fig.tipo === 'circulo') {
      var c = conv(fig.cx, fig.cy);
      ctx.arc(c[0], c[1], fig.r * u, 0, Math.PI * 2);
      ctx.stroke();
    } else if (fig.tipo === 'disco') {
      var d = conv(fig.cx, fig.cy);
      ctx.arc(d[0], d[1], Math.max(1.5, fig.r * u), 0, Math.PI * 2);
      ctx.fill();
    } else if (fig.tipo === 'poligonal') {
      fig.pontos.forEach(function (p, i) {
        var q = conv(p[0], p[1]);
        if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      });
      ctx.stroke();
    } else if (fig.tipo === 'gol') {
      var fundo = conv(0, fig.y)[1];
      var espessura = (2.4 / 100) * alt;
      var topo = fig.dentro > 0 ? fundo - espessura : fundo;
      ctx.fillStyle = cores.cal;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(conv(fig.x1, 0)[0], topo, (fig.x2 - fig.x1) * u, espessura);
    }
    ctx.globalAlpha = 1;
  });
  ctx.restore();
};

/* ===== 30-jogadores.js ===== */
// As pecas dos jogadores em cima do campo e o arrastar com o dedo.
// Regra de ouro: o aplicativo só conhece porcentagem (0 a 100).
// Pixel só existe dentro do gesto e morre quando o dedo solta.

PJ.selecionado = null;   // id do jogador escolhido para a troca
PJ.elPalco = null;
PJ.elPecas = null;

var gesto = null;        // arraste em andamento
var retangulo = null;    // medida do campo, guardada uma vez só
var cliqueMorto = false;

PJ.primeiroNome = function (nome) {
  var limpo = String(nome || '').trim().replace(/\s+/g, ' ');
  var curto = limpo.split(' ')[0] || 'Jogador';
  return curto.length > 9 ? curto.slice(0, 9) : curto;
};

PJ.medirPalco = function () {
  retangulo = PJ.elPalco.getBoundingClientRect();
  return retangulo;
};

function rect() {
  if (!retangulo || !retangulo.width) PJ.medirPalco();
  return retangulo;
}

function pontoParaCampo(clientX, clientY) {
  var r = rect();
  return {
    x: ((clientX - r.left) / r.width) * 100,
    y: 100 - ((clientY - r.top) / r.height) * 100,
  };
}
PJ.pontoParaCampo = pontoParaCampo;

var arred = function (v) { return Math.round(v * 10) / 10; };

// ------------------------------------------------------------ desenhar

function criarPeca(dados) {
  var el = document.createElement('button');
  el.type = 'button';
  el.className = 'peca' + (dados.adversario ? ' adversaria' : '');
  el.dataset.id = dados.id;
  if (dados.adversario) el.dataset.adversario = '1';
  el.style.setProperty('--x', arred(dados.x) + '%');
  el.style.setProperty('--y', arred(100 - dados.y) + '%');
  // perto da lateral, a plaquinha do nome entra para dentro do campo


  var disco = document.createElement('span');
  disco.className = 'disco';
  if (!dados.adversario) {
    var sigla = document.createElement('span');
    sigla.className = 'sigla';
    sigla.textContent = dados.sigla;
    disco.appendChild(sigla);
  }
  var num = document.createElement('span');
  num.className = 'num';
  num.textContent = dados.numero == null ? '' : String(dados.numero);
  disco.appendChild(num);
  el.appendChild(disco);

  if (dados.capitao) {
    var faixa = document.createElement('span');
    faixa.className = 'faixa';
    faixa.textContent = 'C';
    faixa.setAttribute('aria-hidden', 'true');
    el.appendChild(faixa);
  }

  if (dados.adversario) {
    el.setAttribute('aria-label', 'Adversário ' + dados.numero + '. Arraste para mudar de lugar.');
  } else {
    var placa = dados.placa && dados.placa.oculta ? null : document.createElement('span');
    if (placa) {
    placa.className = 'placa';
    placa.textContent = PJ.primeiroNome(dados.nome);
    if (dados.placa) {
      placa.style.maxWidth = Math.round(dados.placa.largura) + 'px';
      placa.style.left = Math.round(dados.placa.esquerda) + 'px';
      placa.style.fontSize = dados.placa.letra + 'px';
      if (dados.placa.acima) el.dataset.placa = 'acima';
    }
    el.appendChild(placa);
    }
    el.setAttribute('aria-label', dados.nome + ', ' +
      (PJ.POSICOES[dados.sigla] ? PJ.POSICOES[dados.sigla].nome : dados.sigla) +
      ', camisa ' + dados.numero + (dados.capitao ? ', capitão' : '') +
      '. Arraste para mudar de lugar.');
  }
  return el;
}

PJ.desenharPecas = function () {
  var c = PJ.campo();
  var m = PJ.modalidade();
  var novo = document.createDocumentFragment();
  var placas = medidasDaPlaca(c.emCampo, PJ.elPalco.clientWidth || 340,
    PJ.elPalco.clientHeight || 520, tamanhoDoDisco());

  c.emCampo.forEach(function (p) {
    var j = PJ.jogadorPorId(p.id);
    if (!j) return;
    var el = criarPeca({
      id: p.id, x: p.x, y: p.y, sigla: j.posicao,
      numero: j.numero, nome: j.nome, placa: placas[p.id],
      capitao: PJ.ehCapitao(p.id),
    });
    if (PJ.selecionado === p.id) el.classList.add('escolhida');
    novo.appendChild(el);
  });

  if (PJ.estado.adversario) {
    c.adversarios.forEach(function (a, i) {
      novo.appendChild(criarPeca({ id: 'adv' + i, x: a.x, y: a.y, numero: a.n, adversario: true }));
    });
  }

  PJ.elPecas.textContent = '';
  PJ.elPecas.appendChild(novo);
};

PJ.montarAdversarios = function () {
  var c = PJ.campo();
  var m = PJ.modalidade();
  if (c.adversarios.length === m.emCampo) return;
  var f = m.formacoes[0];
  c.adversarios = f.jogadores.map(function (slot, i) {
    return { n: i + 1, x: 100 - slot[1], y: 100 - slot[2] };
  });
};

function tamanhoDoDisco() {
  var v = parseFloat(getComputedStyle(PJ.elPalco).getPropertyValue('--disco'));
  return Number.isFinite(v) ? v : 52;
}

// Numa fileira de quatro zagueiros as plaquinhas de nome se encavalam, e
// a do lateral ainda cai para fora do campo. Cada plaquinha ganha aqui uma
// faixa própria — do meio do caminho até o vizinho da esquerda ao meio do
// caminho até o da direita, sem passar da linha lateral. Quando o time
// fica muito apertado a letra diminui, mas um nome nunca cobre o outro.
var ALTURA_PLACA = 24;

PJ.medidasDaPlaca = function () {
  return medidasDaPlaca.apply(null, arguments);
};

function medidasDaPlaca(lista, larguraCampo, alturaCampo, disco, alturaPlaca) {
  var altura = alturaPlaca || ALTURA_PLACA;
  var folgaMinima = altura < 40 ? 30 : altura * 0.9;
  // 1) onde cada nome vai ficar: embaixo do disco, ou em cima dele quando
  //    o jogador está colado na linha de fundo
  var pontos = lista.map(function (p) {
    var cy = ((100 - p.y) / 100) * alturaCampo;
    var acima = cy + disco / 2 + 4 + altura > alturaCampo;
    var topo = acima ? cy - disco / 2 - 4 - altura : cy + disco / 2 + 4;
    return {
      id: p.id,
      cx: (p.x / 100) * larguraCampo,
      acima: acima,
      topo: topo,
      base: topo + altura,
    };
  });

  // 2) cada nome só disputa espaço com quem ficou na mesma altura de tela
  var medidas = {};
  pontos.forEach(function (p) {
    var limEsq = 2;
    var limDir = larguraCampo - 2;
    pontos.forEach(function (o) {
      if (o === p) return;
      if (o.base <= p.topo || o.topo >= p.base) return;  // alturas não se cruzam
      // quando dois estão na mesma coluna (goleiro e zagueiro central, por
      // exemplo) o desempate é pelo id, senão nenhum dos dois cede espaço
      var ehEsquerda = o.cx < p.cx || (o.cx === p.cx && o.id < p.id);
      if (ehEsquerda) limEsq = Math.max(limEsq, (o.cx + p.cx) / 2 + 3);
      else limDir = Math.min(limDir, (o.cx + p.cx) / 2 - 3);
    });
    var folga = limDir - limEsq;
    // sem espaço nem para duas letras, o nome sai de cena em vez de cobrir
    // o do companheiro — o disco continua mostrando número e posição, e o
    // nome inteiro aparece ao tocar no jogador
    if (folga < folgaMinima) { medidas[p.id] = { oculta: true, acima: p.acima }; return; }
    var largura = Math.min(folga, altura < 40 ? 104 : altura * 4.4);
    var esquerda = PJ.limitar(p.cx - largura / 2, limEsq, limDir - largura);
    medidas[p.id] = {
      largura: largura,
      esquerda: esquerda - (p.cx - disco / 2),
      esquerdaNoCampo: esquerda,
      topo: p.topo,
      letra: largura < 44 ? 10 : (largura < 58 ? 11 : 12.5),
      acima: p.acima,
    };
  });
  return medidas;
}

// ------------------------------------------------------------- arrastar

var LIMIAR = 7; // px antes de virar arraste, para mão tremida ou com luva

function acharEmCampo(id) {
  var lista = PJ.campo().emCampo;
  for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
  return null;
}

function margens(el) {
  var r = rect();
  var t = el.getBoundingClientRect();
  return {
    x: ((t.width / 2) / r.width) * 100,
    y: ((t.height / 2) / r.height) * 100,
  };
}

function comecarArraste(ev) {
  var el = ev.target.closest('.peca');
  if (!el) return;

  var adversario = el.dataset.adversario === '1';
  var alvo = adversario
    ? PJ.campo().adversarios[parseInt(el.dataset.id.slice(3), 10)]
    : acharEmCampo(el.dataset.id);
  if (!alvo) return;

  PJ.medirPalco();
  var m = margens(el);
  gesto = {
    tipo: 'peca',
    pid: ev.pointerId,
    el: el,
    id: el.dataset.id,
    adversario: adversario,
    alvo: alvo,
    x0: alvo.x,
    y0: alvo.y,
    px0: ev.clientX,
    py0: ev.clientY,
    margemX: m.x,
    margemY: m.y,
    moveu: false,
    atual: { x: alvo.x, y: alvo.y },
    quadro: 0,
    ultimo: null,
  };
  try { el.setPointerCapture(ev.pointerId); } catch (err) { /* segue sem captura */ }
  el.style.willChange = 'transform';
  ev.preventDefault();
}

function pintar() {
  if (!gesto || gesto.tipo !== 'peca') return;
  gesto.quadro = 0;
  var ev = gesto.ultimo;
  if (!ev) return;
  var r = rect();

  var dxPx = ev.clientX - gesto.px0;
  var dyPx = ev.clientY - gesto.py0;
  if (!gesto.moveu && Math.sqrt(dxPx * dxPx + dyPx * dyPx) > LIMIAR) {
    gesto.moveu = true;
    gesto.el.classList.add('carregando');
    PJ.marcarOrigem(gesto.x0, gesto.y0);
    PJ.vibrar(15);
  }
  if (!gesto.moveu) return;

  var px = PJ.limitar(gesto.x0 + (dxPx / r.width) * 100, gesto.margemX, 100 - gesto.margemX);
  var py = PJ.limitar(gesto.y0 - (dyPx / r.height) * 100, gesto.margemY, 100 - gesto.margemY);
  gesto.atual = { x: px, y: py };

  var mostraX = ((px - gesto.x0) / 100) * r.width;
  var mostraY = (-(py - gesto.y0) / 100) * r.height;
  gesto.el.style.transform =
    'translate(-50%,-50%) translate3d(' + mostraX + 'px,' + mostraY + 'px,0) scale(1.1)';
}

function seguirArraste(ev) {
  if (!gesto || gesto.tipo !== 'peca' || ev.pointerId !== gesto.pid) return;
  ev.preventDefault();
  gesto.ultimo = ev;
  if (!gesto.quadro) gesto.quadro = window.requestAnimationFrame(pintar);
}

function soltarArraste(ev) {
  if (!gesto || gesto.tipo !== 'peca' || ev.pointerId !== gesto.pid) return;
  var g = gesto;
  var noBanco = !g.adversario && g.moveu && PJ.soltouNoBanco(ev.clientX, ev.clientY);
  encerrarGesto();

  if (!g.moveu) {                       // foi só um toque: escolhe o jogador
    if (!g.adversario) PJ.escolherJogador(g.id);
    else PJ.desenharPecas();
    return;
  }

  cliqueMorto = true;
  window.setTimeout(function () { cliqueMorto = false; }, 400);

  if (noBanco) {
    PJ.antes('tirar do campo');
    var j = PJ.jogadorPorId(g.id);
    PJ.tirarDoCampo(g.id);
    PJ.atualizar();
    PJ.aviso(PJ.primeiroNome(j ? j.nome : '') + ' foi para o banco.', 'Desfazer', PJ.desfazerAcao);
    return;
  }

  PJ.antes('mover jogador');
  g.alvo.x = arred(g.atual.x);
  g.alvo.y = arred(g.atual.y);
  if (!g.adversario) {
    PJ.fixarComoBase();
    PJ.campo().estilo = 'padrao';
  }
  PJ.vibrar(10);
  PJ.atualizar();
  PJ.contarGesto('mover');
  if (!g.adversario) PJ.ofereceTrocarPosicao(g.id, g.alvo.x, g.alvo.y);
}

// Se o sistema tomar o gesto (ligacao, notificacao, gesto de navegacao),
// grava onde o jogador estava — nunca devolve para trás sem avisar.
function abortarArraste(ev) {
  if (!gesto || gesto.tipo !== 'peca') return;
  if (ev && ev.pointerId !== gesto.pid) return;
  var g = gesto;
  encerrarGesto();
  if (!g.moveu) { PJ.desenharPecas(); return; }
  PJ.antes('mover jogador');
  g.alvo.x = arred(g.atual.x);
  g.alvo.y = arred(g.atual.y);
  if (!g.adversario) PJ.fixarComoBase();
  PJ.atualizar();
}

function encerrarGesto() {
  if (!gesto) return;
  var g = gesto;
  gesto = null;                       // zera antes de mexer no elemento, senao o
  if (g.quadro) window.cancelAnimationFrame(g.quadro); // lostpointercapture reentra
  if (g.el) {
    g.el.classList.remove('carregando');
    g.el.style.transform = '';
    g.el.style.willChange = '';
    try { g.el.releasePointerCapture(g.pid); } catch (err) { /* já soltou */ }
  }
  PJ.limparOrigem();
}

PJ.soltouNoBanco = function (x, y) {
  var el = document.elementFromPoint(x, y);
  return !!(el && el.closest('#zonaBanco'));
};

// ---------------------------------------------------- roteador do palco

PJ.ligarGestos = function () {
  PJ.elPalco.addEventListener('pointerdown', function (ev) {
    if (!ev.isPrimary) return;                                   // ignora segundo dedo
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (gesto) return;
    if (PJ.modoDesenho) { PJ.desenhoComecar(ev); return; }
    comecarArraste(ev);
  }, { passive: false });

  PJ.elPalco.addEventListener('pointermove', function (ev) {
    if (!gesto) { PJ.desenhoSeguir(ev); return; }
    seguirArraste(ev);
  }, { passive: false });

  PJ.elPalco.addEventListener('pointerup', function (ev) {
    if (!gesto) { PJ.desenhoTerminar(ev); return; }
    soltarArraste(ev);
  });

  PJ.elPalco.addEventListener('pointercancel', function (ev) {
    if (!gesto) { PJ.desenhoCancelar(ev); return; }
    abortarArraste(ev);
  });
  PJ.elPalco.addEventListener('lostpointercapture', function (ev) { abortarArraste(ev); });
  PJ.elPalco.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  PJ.elPalco.addEventListener('dragstart', function (ev) { ev.preventDefault(); });

  // mata o clique fantasma que o navegador manda depois de um arraste
  PJ.elPalco.addEventListener('click', function (ev) {
    if (cliqueMorto) { ev.stopPropagation(); ev.preventDefault(); cliqueMorto = false; }
  }, true);

  // teclado: mover o jogador com as setas
  PJ.elPecas.addEventListener('keydown', function (ev) {
    var el = ev.target.closest('.peca');
    if (!el) return;
    var passo = ev.shiftKey ? 6 : 2;
    var d = { ArrowLeft: [-passo, 0], ArrowRight: [passo, 0], ArrowUp: [0, passo], ArrowDown: [0, -passo] }[ev.key];
    if (!d) return;
    ev.preventDefault();
    var adversario = el.dataset.adversario === '1';
    var alvo = adversario
      ? PJ.campo().adversarios[parseInt(el.dataset.id.slice(3), 10)]
      : acharEmCampo(el.dataset.id);
    if (!alvo) return;
    PJ.antes('mover jogador');
    alvo.x = arred(PJ.limitar(alvo.x + d[0], 3, 97));
    alvo.y = arred(PJ.limitar(alvo.y + d[1], 3, 97));
    if (!adversario) {
      PJ.fixarComoBase();
      var j = PJ.jogadorPorId(alvo.id);
      PJ.anunciar((j ? j.nome : 'Jogador') + ' movido');
    }
    PJ.atualizar();
    var volta = PJ.elPecas.querySelector('.peca[data-id="' + el.dataset.id + '"]');
    if (volta) volta.focus();
  });

  // a medida do campo muda quando gira a tela, abre o teclado ou some a
  // barra do navegador: remede nesses momentos, nunca a cada movimento
  var remedir = function () { if (PJ.elPalco.isConnected) PJ.medirPalco(); };
  window.addEventListener('resize', remedir);
  window.addEventListener('orientationchange', remedir);
  window.addEventListener('scroll', remedir, true);
  if (window.ResizeObserver) new window.ResizeObserver(remedir).observe(PJ.elPalco);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', remedir);
};

PJ.marcarOrigem = function (x, y) {
  var marca = document.getElementById('origem');
  marca.style.setProperty('--x', arred(x) + '%');
  marca.style.setProperty('--y', arred(100 - y) + '%');
  marca.hidden = false;
};
PJ.limparOrigem = function () {
  var marca = document.getElementById('origem');
  if (marca) marca.hidden = true;
};

PJ.vibrar = function (ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (err) { /* sem vibracao */ }
};

// ------------------------------------------------- entrar, sair e trocar

PJ.tirarDoCampo = function (id) {
  var c = PJ.campo();
  c.emCampo = c.emCampo.filter(function (p) { return p.id !== id; });
  c.base = null;
  if (PJ.selecionado === id) PJ.selecionado = null;
};

PJ.colocarEmCampo = function (id) {
  var c = PJ.campo();
  if (PJ.estaEmCampo(id)) return;
  var vagas = PJ.vagasDaFormacao(PJ.formacaoPorId(c.formacao));
  var jogador = PJ.jogadorPorId(id);
  var livre = null;
  // primeiro procura a vaga da posição dele; senão, a primeira vaga vazia
  [true, false].forEach(function (exigirPosicao) {
    if (livre) return;
    for (var k = 0; k < vagas.length; k++) {
      var v = vagas[k];
      if (exigirPosicao && (!jogador || jogador.posicao !== v.sigla)) continue;
      var ocupada = c.emCampo.some(function (p) {
        return Math.abs(p.x - v.x) < 7 && Math.abs(p.y - v.y) < 7;
      });
      if (!ocupada) { livre = v; return; }
    }
  });
  if (!livre) livre = { sigla: 'MEI', x: 50, y: 50 };
  c.emCampo.push({ id: id, x: livre.x, y: livre.y });
  if (jogador && !PJ.POSICOES[jogador.posicao]) jogador.posicao = livre.sigla;
  c.base = null;
};

PJ.trocarJogador = function (idSai, idEntra) {
  var c = PJ.campo();
  var lugar = null;
  for (var i = 0; i < c.emCampo.length; i++) if (c.emCampo[i].id === idSai) lugar = c.emCampo[i];
  if (!lugar) return false;
  lugar.id = idEntra;
  if (c.base) c.base.forEach(function (p) { if (p.id === idSai) p.id = idEntra; });
  // quem entra herda a posição de quem saiu, se ainda não tiver uma
  var quemEntra = PJ.jogadorPorId(idEntra);
  var quemSai = PJ.jogadorPorId(idSai);
  if (quemEntra && quemSai && !PJ.POSICOES[quemEntra.posicao]) quemEntra.posicao = quemSai.posicao;
  return true;
};

/* ===== 40-desenho.js ===== */
// Modo desenhar: riscar setas em cima do campo, igual caneta na prancheta.
// Os pontos são guardados em porcentagem, entao a seta nunca sai do lugar
// quando o campo muda de tamanho ou o celular vira.

PJ.modoDesenho = false;
PJ.ferramenta = 'seta';     // seta | risco
PJ.corSeta = 'amarelo';

PJ.CORES_SETA = {
  amarelo: '#FFD400',
  branco: '#F5F7F0',
  vermelho: '#D4142A',
};

var traco = null;
var elSetas = null;
var quadroSeta = 0;

PJ.ligarDesenho = function () {
  elSetas = document.getElementById('setas');
};

PJ.desenhoComecar = function (ev) {
  if (!PJ.modoDesenho || traco) return;
  var p = PJ.pontoParaCampo(ev.clientX, ev.clientY);
  traco = {
    tipo: PJ.ferramenta,
    cor: PJ.corSeta,
    pontos: [[p.x, p.y], [p.x, p.y]],
    pid: ev.pointerId,
  };
  try { PJ.elPalco.setPointerCapture(ev.pointerId); } catch (err) { /* segue sem captura */ }
  ev.preventDefault();
};

PJ.desenhoSeguir = function (ev) {
  if (!traco || ev.pointerId !== traco.pid) return;
  ev.preventDefault();
  var amostras = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
  if (!amostras.length) amostras = [ev];

  if (traco.tipo === 'seta') {
    var f = amostras[amostras.length - 1];
    var pf = PJ.pontoParaCampo(f.clientX, f.clientY);
    traco.pontos[1] = [pf.x, pf.y];
  } else {
    for (var i = 0; i < amostras.length; i++) {
      var p = PJ.pontoParaCampo(amostras[i].clientX, amostras[i].clientY);
      var ultimo = traco.pontos[traco.pontos.length - 1];
      if (Math.abs(ultimo[0] - p.x) + Math.abs(ultimo[1] - p.y) > 0.4) traco.pontos.push([p.x, p.y]);
    }
  }
  if (!quadroSeta) quadroSeta = window.requestAnimationFrame(function () {
    quadroSeta = 0;
    PJ.desenharSetas();
  });
};

PJ.desenhoTerminar = function (ev) {
  if (!traco || ev.pointerId !== traco.pid) return;
  var t = traco;
  traco = null;
  try { PJ.elPalco.releasePointerCapture(ev.pointerId); } catch (err) { /* já soltou */ }

  var a = t.pontos[0];
  var b = t.pontos[t.pontos.length - 1];
  var tamanho = Math.sqrt(Math.pow(b[0] - a[0], 2) + Math.pow(b[1] - a[1], 2));
  if (tamanho < 3 && t.pontos.length < 8) { PJ.desenharSetas(); return; } // toque sem querer

  if (t.tipo === 'risco') t.pontos = simplificar(t.pontos, 0.35);
  t.pontos = t.pontos.map(function (p) {
    return [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10];
  });
  PJ.antes('desenhar');
  PJ.campo().setas.push({ tipo: t.tipo, cor: t.cor, pontos: t.pontos });
  PJ.atualizar();
};

PJ.desenhoCancelar = function () {
  traco = null;
  PJ.desenharSetas();
};

// Tira os pontos que não mudam o formato do risco (Ramer-Douglas-Peucker).
// Sem isso, um rabisco de 3 segundos guarda centenas de pontos e um dia
// o celular reclama que a memória acabou.
function simplificar(pontos, tolerancia) {
  if (pontos.length < 3) return pontos;
  var primeiro = 0;
  var ultimo = pontos.length - 1;
  var manter = {};
  manter[primeiro] = true;
  manter[ultimo] = true;

  var pilha = [[primeiro, ultimo]];
  while (pilha.length) {
    var par = pilha.pop();
    var ini = par[0], fim = par[1];
    var maior = 0, indice = -1;
    for (var i = ini + 1; i < fim; i++) {
      var d = distanciaDaReta(pontos[i], pontos[ini], pontos[fim]);
      if (d > maior) { maior = d; indice = i; }
    }
    if (maior > tolerancia && indice > 0) {
      manter[indice] = true;
      pilha.push([ini, indice], [indice, fim]);
    }
  }
  return pontos.filter(function (p, i) { return manter[i]; });
}

function distanciaDaReta(p, a, b) {
  var dx = b[0] - a[0];
  var dy = b[1] - a[1];
  var tam2 = dx * dx + dy * dy;
  if (!tam2) return Math.sqrt(Math.pow(p[0] - a[0], 2) + Math.pow(p[1] - a[1], 2));
  var t = PJ.limitar(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / tam2, 0, 1);
  var px = a[0] + t * dx;
  var py = a[1] + t * dy;
  return Math.sqrt(Math.pow(p[0] - px, 2) + Math.pow(p[1] - py, 2));
}

// ---------------------------------------------------------- desenhar na tela

function caminhoDe(m, pontos) {
  return pontos.map(function (p, i) {
    var q = PJ.paraDesenho(m, p[0], p[1]);
    return (i === 0 ? 'M' : 'L') + (Math.round(q[0] * 100) / 100) + ' ' + (Math.round(q[1] * 100) / 100);
  }).join(' ');
}

function pontaDaSeta(m, pontos) {
  var n = pontos.length;
  var fim = PJ.paraDesenho(m, pontos[n - 1][0], pontos[n - 1][1]);
  var antes = PJ.paraDesenho(m, pontos[n - 2][0], pontos[n - 2][1]);
  var dx = fim[0] - antes[0];
  var dy = fim[1] - antes[1];
  var tam = Math.sqrt(dx * dx + dy * dy);
  if (tam < 0.001) return '';
  dx /= tam; dy /= tam;
  var C = 4.5, A = 2.6;          // comprimento e meia largura da ponta
  var px = -dy, py = dx;
  return [
    fim[0] + ',' + fim[1],
    (fim[0] - dx * C + px * A) + ',' + (fim[1] - dy * C + py * A),
    (fim[0] - dx * C - px * A) + ',' + (fim[1] - dy * C - py * A),
  ].join(' ');
}

PJ.desenharSetas = function () {
  var m = PJ.modalidade();
  var lista = PJ.campo().setas.slice();
  if (traco) lista.push(traco);
  elSetas.setAttribute('viewBox', '0 0 100 ' + (Math.round(m.alturaVB * 1000) / 1000));
  elSetas.setAttribute('preserveAspectRatio', 'none');

  elSetas.innerHTML = lista.map(function (t) {
    var cor = PJ.CORES_SETA[t.cor] || PJ.CORES_SETA.amarelo;
    var partes = ['<path d="' + caminhoDe(m, t.pontos) + '" fill="none" stroke="' + cor +
      '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'];
    if (t.tipo === 'seta' && t.pontos.length > 1) {
      var ponta = pontaDaSeta(m, t.pontos);
      if (ponta) partes.push('<polygon points="' + ponta + '" fill="' + cor + '"/>');
    }
    return partes.join('');
  }).join('');
};

PJ.apagarUltimaSeta = function () {
  var c = PJ.campo();
  if (!c.setas.length) return false;
  PJ.antes('apagar seta');
  c.setas.pop();
  PJ.atualizar();
  return true;
};

PJ.limparSetas = function () {
  var c = PJ.campo();
  if (!c.setas.length) return false;
  PJ.antes('apagar setas');
  c.setas = [];
  PJ.atualizar();
  return true;
};

// ------------------------------------------- redesenhar as setas na foto

PJ.desenharSetasCanvas = function (ctx, ox, oy, larg, alt, setas) {
  var u = larg / 100;
  setas.forEach(function (t) {
    var cor = PJ.CORES_SETA[t.cor] || PJ.CORES_SETA.amarelo;
    var pts = t.pontos.map(function (p) {
      return [ox + (p[0] / 100) * larg, oy + ((100 - p[1]) / 100) * alt];
    });
    if (pts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = cor;
    ctx.fillStyle = cor;
    ctx.lineWidth = 1.6 * u;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.stroke();
    if (t.tipo === 'seta') {
      var fim = pts[pts.length - 1];
      var antes = pts[pts.length - 2];
      var dx = fim[0] - antes[0];
      var dy = fim[1] - antes[1];
      var tam = Math.sqrt(dx * dx + dy * dy);
      if (tam > 0.5) {
        dx /= tam; dy /= tam;
        var C = 4.5 * u, A = 2.6 * u, px = -dy, py = dx;
        ctx.beginPath();
        ctx.moveTo(fim[0], fim[1]);
        ctx.lineTo(fim[0] - dx * C + px * A, fim[1] - dy * C + py * A);
        ctx.lineTo(fim[0] - dx * C - px * A, fim[1] - dy * C - py * A);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  });
};

/* ===== 50-paineis.js ===== */
// As gavetas do aplicativo: banco, táticas, desenhar, meu time, mandar a
// escalação, anotações do jogo e ajustes.

// ------------------------------------------------------ ajudantes de tela

function cria(tag, classe, texto) {
  var el = document.createElement(tag);
  if (classe) el.className = classe;
  if (texto != null) el.textContent = texto;
  return el;
}

function bt(texto, classe, aoTocar, quantos) {
  var b = cria('button', 'bt ' + (classe || ''));
  b.type = 'button';
  b.appendChild(document.createTextNode(texto));
  if (quantos) b.appendChild(cria('span', 'quantos', quantos));
  if (aoTocar) b.addEventListener('click', aoTocar);
  return b;
}

function secao(titulo) {
  var d = cria('div', 'secao');
  if (titulo) d.appendChild(cria('p', 'rotulo', titulo));
  return d;
}

function texto(t, classe) {
  return cria('p', classe || 'explica', t);
}

PJ.cria = cria;
PJ.bt = bt;

// -------------------------------------------------------------- recados

PJ.aviso = function (msg, rotulo, acao) {
  var caixa = document.getElementById('tarjas');
  var t = cria('div', 'tarja boa');
  t.appendChild(cria('p', null, msg));
  if (rotulo && acao) {
    t.appendChild(bt(rotulo, 'pequena', function () { t.remove(); acao(); }));
  }
  t.appendChild(bt('Ok', 'pequena', function () { t.remove(); }));
  caixa.appendChild(t);
  window.setTimeout(function () { if (t.isConnected) t.remove(); }, 12000);
};

PJ.anunciar = function (msg) {
  var a = document.getElementById('anuncio');
  if (a) a.textContent = msg;
};

PJ.avisarSalvo = function (deuCerto) {
  var r = document.getElementById('rodapeSalvo');
  if (!r) return;
  if (deuCerto) {
    r.textContent = 'Tudo salvo neste aparelho';
    r.removeAttribute('data-falhou');
  } else {
    r.textContent = 'Não consegui salvar aqui. Guarde uma cópia em Configurar.';
    r.setAttribute('data-falhou', '1');
  }
};

// Pergunta com duas saídas, sempre com o verbo da ação escrito no botão.
PJ.perguntar = function (msg, rotuloSim, aoConfirmar, perigoso) {
  var caixa = document.getElementById('tarjas');
  var t = cria('div', 'tarja atencao');
  t.appendChild(cria('p', null, msg));
  t.appendChild(bt(rotuloSim, 'pequena ' + (perigoso ? 'perigo' : 'principal'), function () {
    t.remove();
    aoConfirmar();
  }));
  t.appendChild(bt('Cancelar', 'pequena', function () { t.remove(); }));
  caixa.appendChild(t);
};

// Caixinha para digitar um texto, sem usar a janelinha do navegador.
PJ.pedirTexto = function (rotulo, valor, aoConfirmar) {
  var caixa = document.getElementById('tarjas');
  var t = cria('div', 'tarja');
  t.style.flexWrap = 'wrap';
  t.appendChild(cria('p', null, rotulo));
  var campo = document.createElement('input');
  campo.type = 'text';
  campo.value = valor || '';
  campo.style.flex = '1 1 100%';
  t.appendChild(campo);
  var confirmar = function () {
    var v = campo.value.trim();
    t.remove();
    if (v) aoConfirmar(v);
  };
  campo.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); confirmar(); }
  });
  t.appendChild(bt('Salvar', 'pequena principal', confirmar));
  t.appendChild(bt('Cancelar', 'pequena', function () { t.remove(); }));
  caixa.appendChild(t);
  campo.focus();
  campo.select();
};

// ------------------------------------------------------ abrir e fechar

PJ.painelAberto = null;
PJ.pilhaPaineis = [];

PJ.telaGrande = function () {
  return window.matchMedia('(min-width: 900px)').matches;
};

// `deDentro` = abriu a partir de outro painel, então ganha o botão Voltar
PJ.abrirPainel = function (id, deDentro) {
  var painel = PJ.PAINEIS[id];
  if (!painel) return;
  if (deDentro && PJ.painelAberto) PJ.pilhaPaineis.push(PJ.painelAberto);
  else PJ.pilhaPaineis = [];
  PJ.painelAberto = id;
  var folha = document.getElementById('folha');
  folha.hidden = false;
  PJ.recarregarPainel();
  window.requestAnimationFrame(function () { folha.classList.add('aberta'); });
  document.getElementById('cortina').hidden = PJ.telaGrande();
  PJ.marcarBarra();
};

PJ.voltarPainel = function () {
  var anterior = PJ.pilhaPaineis.pop();
  if (!anterior) { PJ.fecharPainel(); return; }
  PJ.painelAberto = anterior;
  PJ.recarregarPainel();
  PJ.marcarBarra();
};

PJ.fecharPainel = function () {
  PJ.pilhaPaineis = [];
  if (PJ.telaGrande()) { PJ.abrirPainel('banco'); return; }
  var folha = document.getElementById('folha');
  folha.classList.remove('aberta');
  folha.removeAttribute('data-alto');
  document.getElementById('cortina').hidden = true;
  PJ.painelAberto = null;
  window.setTimeout(function () { if (!PJ.painelAberto) folha.hidden = true; }, 240);
  PJ.marcarBarra();
};

PJ.recarregarPainel = function () {
  if (!PJ.painelAberto) return;
  var painel = PJ.PAINEIS[PJ.painelAberto];
  if (!painel) return;
  var folha = document.getElementById('folha');
  if (painel.alto && !PJ.telaGrande()) folha.setAttribute('data-alto', '1');
  else folha.removeAttribute('data-alto');
  document.getElementById('folhaTitulo').textContent = painel.titulo();
  var sair = document.getElementById('btFecharFolha');
  sair.textContent = PJ.pilhaPaineis.length ? 'Voltar' : 'Fechar';
  var corpo = document.getElementById('folhaCorpo');
  corpo.textContent = '';
  corpo.scrollTop = 0;
  painel.montar(corpo);
};

PJ.marcarBarra = function () {
  var pares = {
    btBanco: 'banco', btTaticas: 'taticas', btDesenhar: 'desenhar',
    btConfigurar: 'configurar',
  };
  Object.keys(pares).forEach(function (idBotao) {
    var b = document.getElementById(idBotao);
    if (b) b.setAttribute('aria-pressed', PJ.painelAberto === pares[idBotao] ? 'true' : 'false');
  });
};

// linha do menu de configuração: título grande e uma frase explicando
function itemMenu(titulo, descricao, aoTocar, classe) {
  var b = cria('button', 'itemMenu ' + (classe || ''));
  b.type = 'button';
  b.appendChild(cria('strong', null, titulo));
  if (descricao) b.appendChild(cria('span', null, descricao));
  b.addEventListener('click', aoTocar);
  return b;
}
PJ.itemMenu = itemMenu;

// ------------------------------------------- barra do jogador escolhido
// Um toque na peça não abre gaveta nenhuma: só marca o jogador e mostra
// uma barrinha com o que dá para fazer com ele. Assim o campo não some
// atrás de um painel por causa de um toque sem querer.

PJ.escolherJogador = function (id) {
  PJ.selecionado = PJ.selecionado === id ? null : id;
  PJ.render();
};

PJ.mostrarBarraJogador = function () {
  var barra = document.getElementById('barraJogador');
  if (!barra) return;
  var j = PJ.selecionado ? PJ.jogadorPorId(PJ.selecionado) : null;
  if (!j) { barra.hidden = true; barra.textContent = ''; return; }

  barra.textContent = '';
  var pos = PJ.POSICOES[j.posicao] || { nome: j.posicao };
  var quem = cria('span', 'quemEscolhido');
  quem.appendChild(cria('strong', null, j.nome));
  quem.appendChild(cria('span', null, 'camisa ' + j.numero + ' · ' + pos.nome));
  barra.appendChild(quem);

  barra.appendChild(bt('Trocar jogador', 'pequena principal', function () {
    PJ.abrirPainel('banco');
  }));
  barra.appendChild(bt('Tirar do campo', 'pequena', function () {
    PJ.antes('tirar do campo');
    PJ.tirarDoCampo(j.id);
    PJ.atualizar();
    PJ.aviso(PJ.primeiroNome(j.nome) + ' foi para o banco.', 'Desfazer', PJ.desfazerAcao);
  }));
  barra.appendChild(bt('Ficha do jogador', 'pequena', function () {
    PJ.abrirJogador(j.id);
  }));
  barra.appendChild(bt('Soltar', 'pequena', function () {
    PJ.selecionado = null;
    PJ.render();
  }));
  barra.hidden = false;
};

// Quando o jogador é solto num setor diferente do dele, o aplicativo
// PERGUNTA. Nunca muda a posição sozinho — senão a escalação que vai para
// o grupo sai errada, com o goleiro listado no ataque.
PJ.ofereceTrocarPosicao = function (id, x, y) {
  var j = PJ.jogadorPorId(id);
  if (!j) return;
  var sugerida = PJ.siglaPorLugar(PJ.estado.modalidade, x, y);
  var atual = PJ.POSICOES[j.posicao];
  var nova = PJ.POSICOES[sugerida];
  if (!atual || !nova || atual.setor === nova.setor) return;
  PJ.perguntar(
    PJ.primeiroNome(j.nome) + ' está jogando ' + nomeDoSetor(nova.setor) +
      ' agora. Mudar a posição dele para ' + sugerida + '?',
    'Mudar para ' + sugerida,
    function () {
      PJ.antes('trocar posição');
      j.posicao = sugerida;
      PJ.marcarComoMeu(j);
      PJ.atualizar();
    }
  );
};

function nomeDoSetor(setor) {
  return {
    goleiro: 'no gol', defesa: 'na defesa', meio: 'no meio', ataque: 'na frente',
  }[setor] || 'em outro lugar';
}

// ------------------------------------------------------------- BANCO

function fazerTroca(idEntra) {
  var sai = PJ.selecionado;
  if (!sai) return;
  var qSai = PJ.jogadorPorId(sai);
  var qEntra = PJ.jogadorPorId(idEntra);
  PJ.antes('trocar jogador');
  PJ.trocarJogador(sai, idEntra);
  PJ.selecionado = null;
  PJ.registrarNoJogo(PJ.primeiroNome(qSai.nome) + ' saiu, ' + PJ.primeiroNome(qEntra.nome) + ' entrou');
  PJ.atualizar();
  PJ.aviso(PJ.primeiroNome(qSai.nome) + ' saiu. ' + PJ.primeiroNome(qEntra.nome) + ' entrou.',
    'Desfazer', PJ.desfazerAcao);
}

function pecaReserva(j, aoTocar, rotulo) {
  var b = cria('button', 'reserva');
  b.type = 'button';
  b.appendChild(cria('span', 'bolinha', String(j.numero)));
  b.appendChild(cria('span', 'nomeCurto', PJ.primeiroNome(j.nome)));
  b.setAttribute('aria-label', rotulo + ' ' + j.nome);
  b.addEventListener('click', aoTocar);
  return b;
}

PJ.PAINEIS = {};

PJ.PAINEIS.banco = {
  titulo: function () { return 'Banco — quem está fora'; },
  montar: function (corpo) {
    var m = PJ.modalidade();
    var c = PJ.campo();
    var reservas = PJ.banco();
    var faltam = m.emCampo - c.emCampo.length;

    if (PJ.selecionado) {
      var q = PJ.jogadorPorId(PJ.selecionado);
      corpo.appendChild(cria('p', 'rotulo', 'Quem entra no lugar de ' + PJ.primeiroNome(q.nome) + '?'));
    } else {
      corpo.appendChild(texto('Toque no jogador do campo e depois no que vai entrar.'));
    }

    if (reservas.length) {
      var fila = cria('div', 'fileiraBanco');
      reservas.forEach(function (j) {
        fila.appendChild(pecaReserva(j, function () {
          if (PJ.selecionado) { fazerTroca(j.id); return; }
          if (faltam > 0) {
            PJ.antes('colocar em campo');
            PJ.colocarEmCampo(j.id);
            PJ.atualizar();
            PJ.aviso(PJ.primeiroNome(j.nome) + ' entrou em campo.', 'Desfazer', PJ.desfazerAcao);
            return;
          }
          PJ.aviso('O campo já está completo. Toque primeiro no jogador que vai sair.');
        }, PJ.selecionado ? 'Colocar no lugar de' : (faltam > 0 ? 'Colocar em campo:' : 'Reserva')));
      });
      corpo.appendChild(fila);
    } else {
      corpo.appendChild(texto('Todo mundo do seu time está em campo.'));
    }

    if (PJ.selecionado) {
      corpo.appendChild(bt('Cancelar troca', 'larga', function () {
        PJ.selecionado = null;
        PJ.atualizar();
      }));
    }

    corpo.appendChild(cria('p', 'rotulo',
      'Em campo: ' + c.emCampo.length + ' — No banco: ' + reservas.length));

    if (faltam > 0) {
      var falta = cria('div', 'tarja atencao');
      falta.appendChild(cria('p', null, 'Faltam ' + faltam + ' ' +
        (faltam === 1 ? 'jogador' : 'jogadores') + ' para o ' + m.nome + '.'));
      falta.appendChild(bt('Meu time', 'pequena', function () { PJ.abrirPainel('meutime'); }));
      corpo.appendChild(falta);
    }
  },
};

// ------------------------------------------------------------ TÁTICAS

PJ.PAINEIS.taticas = {
  titulo: function () { return 'Táticas e formações'; },
  montar: function (corpo) {
    var m = PJ.modalidade();
    var c = PJ.campo();
    var minhas = PJ.estado.taticas.filter(function (t) { return t.modalidade === m.id; });

    var formacoes = secao('Arrumar o time agora — ' + m.nome);
    formacoes.appendChild(texto('Arruma os jogadores sozinho. Ninguém entra e ninguém sai do campo.'));
    var grade = cria('div', 'grade');
    m.formacoes.forEach(function (f) {
      var b = bt(f.nome, c.formacao === f.id ? 'principal' : '', function () {
        var antes = ondeEstavam();
        PJ.antes('formação');
        PJ.aplicarFormacao(f.id);
        PJ.atualizar();
        PJ.aviso(f.explicacao + quemMudou(antes), 'Desfazer', PJ.desfazerAcao);
      });
      b.title = f.explicacao;
      grade.appendChild(b);
    });
    formacoes.appendChild(grade);

    var salvas = secao('Minhas táticas salvas');
    if (!minhas.length) {
      salvas.appendChild(texto('Arrume o time do seu jeito e toque em "Salvar esta tática" para guardar o desenho e usar de novo no meio do jogo.'));
    } else {
      minhas.slice().reverse().forEach(function (t) { salvas.appendChild(cartaoDeTatica(t)); });
    }
    salvas.appendChild(bt('Salvar esta tática', 'principal larga', abrirSalvarTatica));

    // enquanto não houver tática salva, o que ele precisa ver primeiro,
    // no minuto 60 perdendo de 1 a 0, é a formação pronta
    if (minhas.length) { corpo.appendChild(salvas); corpo.appendChild(formacoes); }
    else { corpo.appendChild(formacoes); corpo.appendChild(salvas); }

    var sEst = secao('Estilo de jogo');
    sEst.appendChild(texto('Muda o time inteiro de lugar de uma vez, conforme o jogo pedir.'));
    PJ.ESTILOS.forEach(function (e) {
      var b = cria('button', 'escolhaEstilo');
      b.type = 'button';
      b.appendChild(document.createTextNode(e.nome));
      b.appendChild(cria('span', null, e.explicacao + ' ' + e.quandoUsar));
      b.setAttribute('aria-pressed', c.estilo === e.id ? 'true' : 'false');
      b.addEventListener('click', function () {
        PJ.antes('estilo de jogo');
        PJ.aplicarEstilo(e.id);
        PJ.registrarNoJogo('Estilo: ' + e.nome);
        PJ.atualizar();
        PJ.aviso('Estilo "' + e.nome + '" aplicado.', 'Desfazer', PJ.desfazerAcao);
      });
      sEst.appendChild(b);
    });
    corpo.appendChild(sEst);
  },
};

function ondeEstavam() {
  var mapa = {};
  PJ.campo().emCampo.forEach(function (p) {
    var j = PJ.jogadorPorId(p.id);
    if (j) mapa[p.id] = { nome: j.nome, y: p.y };
  });
  return mapa;
}

function quemMudou(antes) {
  var mudou = [];
  PJ.campo().emCampo.forEach(function (p) {
    var a = antes[p.id];
    if (!a) return;
    if (Math.abs(a.y - p.y) > 14) {
      mudou.push(PJ.primeiroNome(a.nome) + (p.y > a.y ? ' subiu' : ' recuou'));
    }
  });
  if (!mudou.length) return ' Os jogadores só se ajeitaram, ninguém mudou de setor.';
  return ' ' + mudou.slice(0, 3).join(', ') + '.';
}

function cartaoDeTatica(t) {
  var linha = cria('div', 'secao');
  var cartao = cria('button', 'cartaoTatica');
  cartao.type = 'button';
  var mini = cria('span', 'miniatura');
  t.vagas.forEach(function (v) {
    var ponto = cria('i');
    ponto.style.left = v.x + '%';
    ponto.style.top = (100 - v.y) + '%';
    mini.appendChild(ponto);
  });
  cartao.appendChild(mini);
  var info = cria('span', 'info');
  info.appendChild(cria('strong', null, t.nome));
  info.appendChild(cria('span', null, t.vagas.length + ' lugares · salva em ' + t.criadaEm));
  cartao.appendChild(info);
  cartao.addEventListener('click', function () {
    PJ.antes('trocar de tática');
    var c = PJ.campo();
    PJ.encaixarNasVagas(t.vagas);
    c.estilo = t.estilo || 'padrao';
    PJ.registrarNoJogo('Tática: ' + t.nome);
    PJ.atualizar();
    var extra = t.vagas.length > c.emCampo.length
      ? ' A tática tem ' + t.vagas.length + ' lugares e você tem ' + c.emCampo.length + ' em campo.'
      : '';
    PJ.aviso('Desenho da tática "' + t.nome + '" aplicado. Os mesmos jogadores continuam em campo.' + extra,
      'Desfazer', PJ.desfazerAcao);
  });
  linha.appendChild(cartao);

  var acoes = cria('div', 'linhaBotoes');
  acoes.appendChild(bt('Trocar nome', 'pequena', function () {
    PJ.pedirTexto('Novo nome da tática', t.nome, function (v) {
      PJ.antes('nome da tática');
      t.nome = v;
      PJ.atualizar();
    });
  }));
  acoes.appendChild(bt('Apagar tática', 'pequena perigo', function () {
    PJ.perguntar('Apagar a tática "' + t.nome + '"?', 'Apagar tática', function () {
      PJ.antes('apagar tática');
      PJ.estado.taticas = PJ.estado.taticas.filter(function (x) { return x !== t; });
      PJ.atualizar();
      PJ.aviso('Tática apagada.', 'Desfazer', PJ.desfazerAcao);
    }, true);
  }));
  linha.appendChild(acoes);
  return linha;
}

function abrirSalvarTatica() {
  var m = PJ.modalidade();
  var c = PJ.campo();
  var corpo = document.getElementById('folhaCorpo');
  var caixa = cria('div', 'secao');
  caixa.appendChild(cria('p', 'rotulo', 'Nome da tática'));
  var campo = document.createElement('input');
  campo.type = 'text';
  campo.placeholder = 'Ex: Segurar o resultado';
  caixa.appendChild(campo);

  var sugestoes = cria('div', 'linhaBotoes');
  [PJ.formacaoPorId(c.formacao).nome, 'Começo de jogo', 'Segurar o resultado',
    'Partir pro ataque', 'Com um a menos'].forEach(function (s) {
    sugestoes.appendChild(bt(s, 'pequena', function () { campo.value = s; campo.focus(); }));
  });
  caixa.appendChild(sugestoes);
  caixa.appendChild(texto('A tática guarda só o desenho: os lugares em campo. Não guarda quem estava em cada lugar, então aplicar de novo no meio do jogo não desfaz as suas trocas.'));

  var acoes = cria('div', 'linhaBotoes');
  acoes.appendChild(bt('Salvar', 'principal', function () {
    var nome = campo.value.trim() || ('Tática ' + (PJ.estado.taticas.length + 1));
    PJ.antes('salvar tática');
    PJ.estado.taticas.push({
      nome: nome,
      modalidade: m.id,
      criadaEm: PJ.hoje(),
      estilo: c.estilo,
      vagas: c.emCampo.map(function (p) {
        var j = PJ.jogadorPorId(p.id);
        return { sigla: j ? j.posicao : 'MEI', x: p.x, y: p.y };
      }),
    });
    PJ.atualizar();
    PJ.aviso('Tática "' + nome + '" salva.');
  }));
  acoes.appendChild(bt('Cancelar', '', function () { PJ.recarregarPainel(); }));
  caixa.appendChild(acoes);

  corpo.textContent = '';
  corpo.appendChild(caixa);
  campo.focus();
}

// ----------------------------------------------------------- DESENHAR

PJ.PAINEIS.desenhar = {

    corpo.appendChild(texto('Arraste o dedo no campo para fazer a seta. Enquanto você desenha, os jogadores ficam travados.'));

    var ferramentas = cria('div', 'linhaBotoes');
    [['seta', 'Seta'], ['risco', 'Risco livre']].forEach(function (par) {
      ferramentas.appendChild(bt(par[1], PJ.ferramenta === par[0] ? 'principal' : '', function () {
        PJ.ferramenta = par[0];
        PJ.recarregarPainel();
      }));
    });
    corpo.appendChild(ferramentas);

    var cores = cria('div', 'linhaBotoes');
    [['amarelo', 'Amarelo'], ['branco', 'Branco'], ['vermelho', 'Vermelho']].forEach(function (par) {
      var b = bt(par[1], PJ.corSeta === par[0] ? 'principal' : '', function () {

PJ.quando = function (iso) {
  if (!iso) return 'sem data';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return 'sem data';
  var dd = function (n) { return (n < 10 ? '0' : '') + n; };
  return dd(d.getDate()) + '/' + dd(d.getMonth() + 1) + '/' + d.getFullYear() +
    ' às ' + dd(d.getHours()) + ':' + dd(d.getMinutes());
};

PJ.vagasPuladas = {};

// Qual lugar do campo ainda está vazio — para o aplicativo dizer, enquanto
// ele digita, qual posição está sendo preenchida. Sem isso o artilheiro
// que ele digita primeiro acaba escalado no gol.
PJ.proximaVaga = function () {
  var c = PJ.campo();
  var m = PJ.modalidade();
  if (c.emCampo.length >= m.emCampo) return null;
  var vagas = PJ.vagasDaFormacao(PJ.formacaoPorId(c.formacao));
  for (var i = 0; i < vagas.length; i++) {
    var v = vagas[i];
    if (PJ.vagasPuladas[v.sigla + v.x + v.y]) continue;
    var ocupada = c.emCampo.some(function (p) {
      return Math.abs(p.x - v.x) < 7 && Math.abs(p.y - v.y) < 7;
    });
    if (!ocupada) return v;
  }
  return null;
};

PJ.PAINEIS.meutime = {
  alto: true,
  titulo: function () { return 'Meu time'; },
  montar: function (corpo) {
    var vaga = PJ.proximaVaga();
    var faltam = PJ.modalidade().emCampo - PJ.campo().emCampo.length;

    var caixa = cria('div', 'secao');
    caixa.appendChild(cria('p', 'rotulo', vaga
      ? 'Agora o ' + PJ.POSICOES[vaga.sigla].nome.toUpperCase() +
        (faltam > 1 ? ' — faltam ' + faltam : '')
      : 'Adicionar jogador para o banco'));
    var linha = cria('div', 'linhaBotoes');
    var nome = document.createElement('input');
    nome.type = 'text';
    nome.placeholder = 'Nome do jogador';
    nome.id = 'novoNome';
    nome.style.flex = '3 1 180px';
    var numero = document.createElement('input');
    numero.type = 'number';
    numero.inputMode = 'numeric';
    numero.min = '0';
    numero.max = '99';
    numero.placeholder = 'Número';
    numero.id = 'novoNumero';
    numero.value = String(vaga ? PJ.numeroParaPosicao(vaga.sigla) : PJ.proximoNumero());
    numero.style.flex = '1 1 90px';
    linha.appendChild(nome);
    linha.appendChild(numero);
    caixa.appendChild(linha);

    var adicionar = function () {
      var v = nome.value.trim();
      if (!v) { nome.focus(); return; }
      var repetido = PJ.estado.elenco.some(function (j) {
        return j.nome.toLowerCase() === v.toLowerCase();
      });
      var gravar = function (nomeFinal) {
        PJ.antes('adicionar jogador');
        var n = parseInt(numero.value, 10);
        var novo = {
          id: PJ.uid(),
          nome: nomeFinal,
          numero: Number.isFinite(n) ? PJ.limitar(n, 0, 99)
            : (vaga ? PJ.numeroParaPosicao(vaga.sigla) : PJ.proximoNumero()),
          posicao: vaga ? vaga.sigla : 'MEI',
        };
        PJ.estado.elenco.push(novo);
        if (vaga) PJ.colocarEmCampo(novo.id);
        PJ.atualizar();
        var campoNome = document.getElementById('novoNome');
        if (campoNome) campoNome.focus();
        if (vaga) {
          PJ.anunciar(nomeFinal + ' entrou ' + nomeDoSetor(PJ.POSICOES[vaga.sigla].setor));
        }
      };
      if (repetido) {
        PJ.perguntar('Já existe um ' + v + ' no time. Adicionar assim mesmo?', 'Adicionar', function () {
          gravar(v + ' 2');
        });
        return;
      }
      gravar(v);
    };
    nome.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); adicionar(); }
    });

    var acoes = cria('div', 'linhaBotoes');
    acoes.appendChild(bt('Adicionar', 'principal', adicionar));
    if (vaga) {
      acoes.appendChild(bt('Pular esta posição', '', function () {
        PJ.vagasPuladas[vaga.sigla + vaga.x + vaga.y] = true;
        PJ.recarregarPainel();
      }));
    }
    caixa.appendChild(acoes);
    caixa.appendChild(texto('Dica: dá para falar o nome no microfone do teclado do celular. Depois é só arrastar quem estiver fora do lugar.'));
    corpo.appendChild(caixa);

    corpo.appendChild(bt('Colar lista de nomes do WhatsApp', 'larga', colarLista));
    corpo.appendChild(bt('Comissão técnica', 'larga', function () { PJ.abrirPainel('comissao', true); }));

    var deExemplo = PJ.quantosDeExemplo();
    if (deExemplo) {
      var tarja = cria('div', 'tarja atencao');
      tarja.appendChild(cria('p', null, 'Ainda há ' + deExemplo +
        (deExemplo === 1 ? ' nome de exemplo na lista.' : ' nomes de exemplo na lista.') +
        ' Troque o nome de cada um pelo do seu jogador, ou apague todos de uma vez. Quem você já mudou fica no time.'));
      tarja.appendChild(bt('Apagar os ' + deExemplo + ' de exemplo', 'pequena perigo', function () {
        PJ.perguntar('Apagar os ' + deExemplo + ' nomes de exemplo? Os jogadores que você já mudou continuam no time.',
          'Apagar os de exemplo', function () {
            var n = PJ.apagarNomesDeExemplo();
            PJ.aviso(n + ' nomes de exemplo saíram da lista.', 'Desfazer', PJ.desfazerAcao);
          }, true);
      }));
      corpo.appendChild(tarja);
    }

    var lista = cria('div', 'lista');

// Dois jogadores não podem ter a mesma camisa: o aplicativo oferece a
// troca, que é o que o treinador quer fazer nove entre dez vezes.
PJ.definirNumero = function (j, novoNumero) {
  if (!Number.isFinite(novoNumero)) return;
  novoNumero = PJ.limitar(novoNumero, 0, 99);
  if (novoNumero === j.numero) return;
  var dono = null;
  PJ.estado.elenco.forEach(function (outro) {
    if (outro !== j && outro.numero === novoNumero) dono = outro;
  });
  if (!dono) {
    PJ.antes('número da camisa');
    j.numero = novoNumero;
    PJ.marcarComoMeu(j);
    PJ.atualizar();
    return;
  }
  PJ.perguntar('A camisa ' + novoNumero + ' já é do ' + PJ.primeiroNome(dono.nome) +
    '. Trocar os números entre os dois?', 'Trocar os dois', function () {
    PJ.antes('número da camisa');
    dono.numero = j.numero;
    j.numero = novoNumero;
    PJ.marcarComoMeu(j);
    PJ.marcarComoMeu(dono);
    PJ.atualizar();
    PJ.aviso(PJ.primeiroNome(j.nome) + ' ficou com a ' + j.numero + ' e ' +
      PJ.primeiroNome(dono.nome) + ' com a ' + dono.numero + '.', 'Desfazer', PJ.desfazerAcao);
  });
};

PJ.apagarJogador = function (id) {
  var j = PJ.jogadorPorId(id);
  if (!j) return;
  PJ.antes('apagar jogador');
  PJ.estado.elenco = PJ.estado.elenco.filter(function (x) { return x.id !== id; });
  if (PJ.estado.capitao === id) PJ.estado.capitao = null;
  PJ.ORDEM_MODALIDADES.forEach(function (mid) {
    var c = PJ.estado.campos[mid];
    c.emCampo = c.emCampo.filter(function (p) { return p.id !== id; });
    if (c.base) c.base = c.base.filter(function (p) { return p.id !== id; });
  });
  if (PJ.selecionado === id) PJ.selecionado = null;
  PJ.atualizar();
  PJ.aviso(j.nome + ' foi apagado.', 'Desfazer', PJ.desfazerAcao);
};

// Tira da lista SÓ os nomes de exemplo em que ninguém encostou. Quem o
// treinador renomeou, renumerou ou mudou de posição fica. E isso nunca
// acontece sozinho: só quando ele toca no botão.
PJ.apagarNomesDeExemplo = function () {
  var sobra = PJ.estado.elenco.filter(function (j) { return !j.exemplo; });
  var quantos = PJ.estado.elenco.length - sobra.length;
  if (!quantos) return 0;
  var fica = {};
  sobra.forEach(function (j) { fica[j.id] = true; });
  PJ.antes('apagar nomes de exemplo');
  PJ.estado.elenco = sobra;
  PJ.estado.exemplo = false;
  PJ.ORDEM_MODALIDADES.forEach(function (id) {
    var c = PJ.estado.campos[id];
    c.emCampo = c.emCampo.filter(function (p) { return fica[p.id]; });
    c.base = null;
  });
  PJ.completarEscalacao();
  PJ.atualizar();
  return quantos;
};

function colarLista() {
  var corpo = document.getElementById('folhaCorpo');

  caixa.appendChild(cria('p', 'rotulo', 'Cole aqui a lista de nomes, um por linha'));
  var area = document.createElement('textarea');
  area.className = 'caixaTexto';
  area.placeholder = '1 - Zé\n2 - Nando\n3 - Tião';
  caixa.appendChild(area);
  caixa.appendChild(texto('A ordem da lista vira a ordem do campo: o primeiro nome vai para o gol. Depois é só arrastar quem estiver fora do lugar.'));
  var acoes = cria('div', 'linhaBotoes');
  acoes.appendChild(bt('Adicionar todos', 'principal', function () {
    var linhas = area.value.split('\n').map(function (l) {
      return l.replace(/^[\s\-•*.\d)]+/, '').replace(/\(.*?\)/g, '').trim();
    }).filter(function (l) { return l.length > 0 && l.length < 40; });
    if (!linhas.length) { PJ.aviso('Não achei nenhum nome nessa lista.'); return; }
    PJ.antes('colar lista');
    linhas.forEach(function (nome) {
      PJ.estado.elenco.push({ id: PJ.uid(), nome: nome, numero: PJ.proximoNumero(), posicao: '' });
    });
    PJ.completarEscalacao();
    PJ.atualizar();
    PJ.aviso(linhas.length + ' jogadores adicionados.', 'Desfazer', PJ.desfazerAcao);
  }));
  acoes.appendChild(bt('Cancelar', '', function () { PJ.recarregarPainel(); }));
  caixa.appendChild(acoes);
  corpo.textContent = '';
  corpo.appendChild(caixa);
  area.focus();
}

// Coloca em campo quem estiver sobrando, até completar a modalidade.
PJ.completarEscalacao = function () {
  var m = PJ.modalidade();
  var c = PJ.campo();
  var vagas = PJ.vagasDaFormacao(PJ.formacaoPorId(c.formacao));
  var fora = PJ.banco();
  var k = 0;
  while (c.emCampo.length < m.emCampo && k < fora.length) {
    var v = vagas[c.emCampo.length];
    if (!v) break;
    c.emCampo.push({ id: fora[k].id, x: v.x, y: v.y });
    var j = PJ.jogadorPorId(fora[k].id);
    if (j && !PJ.POSICOES[j.posicao]) j.posicao = v.sigla;
    k++;
  }
  c.base = null;
};

// Mandar a escalação, gerar a foto do campo, anotações do jogo e ajustes.

PJ.hoje = function () {
  var d = new Date();
  var doisDigitos = function (n) { return (n < 10 ? '0' : '') + n; };
  return doisDigitos(d.getDate()) + '/' + doisDigitos(d.getMonth() + 1) + '/' + d.getFullYear();
};

PJ.relogioDoJogo = function () {
  var d = new Date();
  return ((d.getHours() < 10 ? '0' : '') + d.getHours()) + ':' +
    ((d.getMinutes() < 10 ? '0' : '') + d.getMinutes());
};

// ------------------------------------------------- texto da escalação

PJ.textoDaEscalacao = function (recado) {
  var m = PJ.modalidade();
  var c = PJ.campo();
  var grupos = { goleiro: [], defesa: [], meio: [], ataque: [] };
  c.emCampo.slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; }).forEach(function (p) {
    var j = PJ.jogadorPorId(p.id);
    if (!j) return;
    var pos = PJ.POSICOES[j.posicao] || { setor: 'meio' };
    grupos[pos.setor].push(j.numero + ' ' + j.nome + (PJ.ehCapitao(j.id) ? ' (C)' : ''));
  });

  var linhas = [];
  linhas.push('ESCALAÇÃO — ' + PJ.estado.nomeTime.toUpperCase());
  linhas.push(m.nome + ' — ' + PJ.hoje());
  var est = PJ.estiloPorId(c.estilo);
  var nomeFormacao = '';
  m.formacoes.forEach(function (f) { if (f.id === c.formacao) nomeFormacao = f.nome; });
  if (nomeFormacao) linhas.push('Formação: ' + nomeFormacao + (est.id !== 'padrao' ? ' — ' + est.nome : ''));
  linhas.push('');
  if (grupos.goleiro.length) linhas.push('Goleiro: ' + grupos.goleiro.join(', '));
  if (grupos.defesa.length) linhas.push('Defesa: ' + grupos.defesa.join(', '));
  if (grupos.meio.length) linhas.push('Meio: ' + grupos.meio.join(', '));
  if (grupos.ataque.length) linhas.push('Frente: ' + grupos.ataque.join(', '));
  var banco = PJ.banco();
  if (banco.length) {
    linhas.push('');
    linhas.push('Banco: ' + banco.map(function (j) { return j.numero + ' ' + j.nome; }).join(', '));
  }
  var comissao = PJ.estado.comissao.filter(function (c) { return c.nome; });
  if (comissao.length) {
    linhas.push('');
    comissao.forEach(function (c) { linhas.push(c.cargo + ': ' + c.nome); });
  }
  if (recado) { linhas.push(''); linhas.push(recado); }
  return linhas.join('\n');
};

// Entregar um arquivo ao treinador funciona de dois jeitos: na página
// publicada quem salva é o próprio aplicativo do Claude; no arquivo aberto
// do computador é o link de download comum do navegador.
PJ.entregarArquivo = function (nomeArquivo, dados, recado) {
  var pelaAncora = function () {
    try {
      var ehBlob = typeof Blob !== 'undefined' && dados instanceof Blob;
      var url = ehBlob
        ? URL.createObjectURL(dados)
        : 'data:text/plain;charset=utf-8,' + encodeURIComponent(dados);
      var a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      a.remove();
      if (ehBlob) window.setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      PJ.aviso('Arquivo salvo no aparelho.');
    } catch (err) {
      PJ.aviso(recado);
    }
  };

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (downloads) {
      if (!downloads) { PJ.aviso(recado); return; }
      downloads.save({ filename: nomeArquivo, data: dados }).then(function () {
        PJ.aviso('Arquivo salvo no aparelho.');
      }, function (erro) {
        if (erro && erro.code === 'declined') return;   // ele mesmo cancelou
        PJ.aviso(recado);
      });
    }, function () { PJ.aviso(recado); });
    return;
  }
  pelaAncora();
};

PJ.copiar = function (txt, campo, recado) {
  var msg = recado || 'Lista copiada. Agora é só colar no WhatsApp.';
  var deuCerto = function () { PJ.aviso(msg); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(deuCerto, function () { selecionar(campo, msg); });
      return;
    }
  } catch (err) { /* cai para a seleção na mão */ }
  selecionar(campo, msg);
};

function selecionar(campo, msg) {
  if (!campo) return;
  campo.readOnly = false;
  campo.focus();
  campo.setSelectionRange(0, campo.value.length);
  try {
    document.execCommand('copy');
    PJ.aviso(msg || 'Lista copiada. Agora é só colar no WhatsApp.');
  } catch (err) {
    PJ.aviso('Segure o dedo no texto marcado e escolha Copiar.');
  }
  campo.readOnly = true;
}
