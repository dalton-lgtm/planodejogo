<title>Plano de Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;125,800&family=Chivo:wght@400;700;900&display=swap">
<style>
/* ===== 01-base.css ===== */
/* Cal, colete e sumula: as cores vem do material do futebol de varzea,
   nao do mundo de aplicativo. Tudo pensado para ler em pe, no sol. */

:root {
  --cal: #f5f7f0;
  --fundo: #e3e7db;
  --painel: #f5f7f0;
  --painel2: #ebeee3;
  --texto: #11160f;
  --texto2: #4a5346;
  --contorno: #11160f;
  --divisa: rgba(17, 22, 15, 0.16);
  --acao: #f25c05;
  --acaoTexto: #11160f;
  --casa: #f25c05;
  --visitante: #1257c9;
  --selecao: #ffd400;
  --perigo: #c4102a;
  --meio: #d4142a;
  --grama: #2e7d32;
  --gramaFaixa: #276e2b;
  --gramaBorda: #245c27;
  --sombraPeca: 0 3px 0 rgba(6, 18, 8, 0.45), 0 5px 8px rgba(6, 18, 8, 0.25);
  --sombraPecaAlta: 0 12px 0 rgba(6, 18, 8, 0.3), 0 16px 22px rgba(6, 18, 8, 0.35);
  --raio: 10px;
  --letra: 'Chivo', 'Trebuchet MS', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  --placar: 'Archivo', 'Archivo Expanded', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

:root:not([data-theme='light']) {
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --cal: #f5f7f0;
    --fundo: #0c1210;
    --painel: #172119;
    --painel2: #1e2a20;
    --texto: #f5f7f0;
    --texto2: #b3bdb0;
    --divisa: rgba(245, 247, 240, 0.16);
    --acao: #ff6b1a;
    --casa: #ff6b1a;
    --visitante: #3d82f5;
    --perigo: #ff3b4e;
    --meio: #ff3b4e;
    --grama: #1e5626;
    --gramaFaixa: #1a4b21;
    --gramaBorda: #133c19;
    --sombraPeca: 0 3px 0 rgba(0, 0, 0, 0.55), 0 5px 8px rgba(0, 0, 0, 0.4);
    --sombraPecaAlta: 0 12px 0 rgba(0, 0, 0, 0.4), 0 16px 22px rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme='dark'] {
  --cal: #f5f7f0;
  --fundo: #0c1210;
  --painel: #172119;
  --painel2: #1e2a20;
  --texto: #f5f7f0;
  --texto2: #b3bdb0;
  --divisa: rgba(245, 247, 240, 0.16);
  --acao: #ff6b1a;
  --casa: #ff6b1a;
  --visitante: #3d82f5;
  --perigo: #ff3b4e;
  --meio: #ff3b4e;
  --grama: #1e5626;
  --gramaFaixa: #1a4b21;
  --gramaBorda: #133c19;
  --sombraPeca: 0 3px 0 rgba(0, 0, 0, 0.55), 0 5px 8px rgba(0, 0, 0, 0.4);
  --sombraPecaAlta: 0 12px 0 rgba(0, 0, 0, 0.4), 0 16px 22px rgba(0, 0, 0, 0.5);
}

/* Tela para o sol: mais contraste, botao maior, linha mais grossa. */
:root[data-sol='1'] {
  --fundo: #ffffff;
  --painel: #ffffff;
  --painel2: #f0f0ee;
  --texto: #000000;
  --texto2: #23271f;
  --divisa: rgba(0, 0, 0, 0.35);
  --grama: #17672c;
  --gramaFaixa: #135824;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--letra);
  font-size: 17px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3 { margin: 0; font-weight: 900; text-wrap: balance; }

button {
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

input, textarea, select {
  font-family: inherit;
  font-size: 17px;
  color: var(--texto);
  background: var(--painel);
  border: 2px solid var(--divisa);
  border-radius: var(--raio);
  padding: 14px 12px;
  min-height: 54px;
  width: 100%;
}
input:focus-visible, textarea:focus-visible, select:focus-visible { border-color: var(--acao); }

:focus-visible {
  outline: 3px solid var(--selecao);
  outline-offset: 2px;
}

/* ------------------------------------------------------------- botoes */

.bt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 56px;
  padding: 12px 18px;
  border-radius: var(--raio);
  border: 2px solid var(--contorno);
  background: var(--painel);
  color: var(--texto);
  text-align: center;
}
.bt:active { transform: translateY(1px); }
.bt[disabled] { opacity: 0.4; cursor: default; }

.bt.principal {
  background: var(--acao);
  color: #11160f;
  border-color: #11160f;
}
.bt.perigo {
  background: transparent;
  color: var(--perigo);
  border-color: var(--perigo);
}
.bt.larga { width: 100%; }
.bt.pequena { min-height: 48px; font-size: 16px; padding: 8px 12px; }

:root[data-sol='1'] .bt { min-height: 64px; font-size: 20px; border-width: 3px; }

.linhaBotoes { display: flex; gap: 12px; flex-wrap: wrap; }
.linhaBotoes > * { flex: 1 1 140px; }

.rotulo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--texto2);
}

.explica { font-size: 15px; color: var(--texto2); margin: 4px 0 0; }

.sr {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* ===== 02-campo.css ===== */
/* O campo e a peca do jogador. O campo fica sempre em pe, com o nosso gol
   embaixo, igual ao desenho que o treinador fez a mao. */

.areaCampo {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 18px 16px 14px;
}

/* Em tela larga sobra muito espaço ao lado do campo em pé: ali ficam o
   banco e a comissão técnica, sempre à vista. */
.listaLado {
  display: none;
  width: 250px;
  flex: none;
  align-self: stretch;
  flex-direction: column;
  min-height: 0;
}
@media (min-width: 1080px) {
  .listaLado { display: flex; }
}

#palco {
  position: relative;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: var(--grama);
  border: 0;
  outline: 3px solid var(--gramaBorda);
  outline-offset: 0;
}

/* superficie: muda com a modalidade, para o treinador ver que trocou */
#palco[data-superficie='grama'] {
  background-image: repeating-linear-gradient(
    to bottom,
    var(--grama) 0 12.5%,
    var(--gramaFaixa) 12.5% 25%
  );
}
#palco[data-superficie='sintetico'] {
  background-color: #245f35;
  background-image: repeating-linear-gradient(
    to right,
    rgba(255, 255, 255, 0.05) 0 1px,
    transparent 1px 12.5%
  );
}
#palco[data-superficie='quadra'] { background-color: #2f5358; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) #palco[data-superficie='sintetico'] { background-color: #163f24; }
  :root:not([data-theme='light']) #palco[data-superficie='quadra'] { background-color: #1b383c; }
}
:root[data-theme='dark'] #palco[data-superficie='sintetico'] { background-color: #163f24; }
:root[data-theme='dark'] #palco[data-superficie='quadra'] { background-color: #1b383c; }

.camada {
  position: absolute;
  inset: 0;
  /* SVG é elemento substituído: sem largura e altura explícitas ele usa o
     tamanho natural e ignora o `inset`, desenhando o campo mais curto que
     a caixa — e aí as linhas saem do lugar dos jogadores */
  width: 100%;
  height: 100%;
  overflow: visible;
}
#linhas, #setas { pointer-events: none; }
#pecas { pointer-events: none; }
#pecas .peca { pointer-events: auto; }

/* no modo desenhar, a caneta pega o campo e os jogadores ficam travados */
#palco[data-modo='desenhar'] #setas { pointer-events: auto; }
#palco[data-modo='desenhar'] .peca { pointer-events: none; }
#palco[data-modo='desenhar'] { outline-color: var(--acao); outline-width: 5px; }

/* ------------------------------------------------ linhas de cal do campo */

#linhas .cal {
  fill: none;
  stroke: var(--cal);
  stroke-opacity: 0.92;
  stroke-width: 0.8;
  stroke-linejoin: round;
}
#linhas .cal.fraca { stroke-opacity: 0.5; }
#linhas .cal.meio { stroke: var(--meio); stroke-width: 1.15; stroke-opacity: 1; }
#linhas .calCheia { fill: var(--cal); fill-opacity: 0.92; stroke: none; }
#linhas .gol { fill: var(--cal); fill-opacity: 0.85; stroke: none; }
#linhas .rede { stroke: var(--gramaBorda); stroke-width: 0.35; }

:root[data-sol='1'] #linhas .cal { stroke-width: 1.2; stroke-opacity: 1; }
:root[data-sol='1'] #linhas .cal.meio { stroke-width: 1.7; }

/* --------------------------------------------------- peca do jogador */

/* o tamanho da peca e calculado no codigo, a partir do tamanho do campo,
   para o numero e o nome nunca ficarem pequenos demais no celular */
#palco { --disco: 52px; }

.peca {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  width: var(--disco);
  height: var(--disco);
  display: block;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  background: none;
  border: 0;
  padding: 0;
  z-index: 2;
}

.peca .disco {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--casa);
  border: 3px solid var(--contorno);
  box-shadow: var(--sombraPeca);
  color: var(--cal);
  line-height: 1;
  overflow: hidden;
}
/* a sigla da posição mora DENTRO do disco: assim ela nunca encosta no
   nome do companheiro da linha de trás */
.peca .disco .sigla {
  font-family: var(--letra);
  font-weight: 700;
  font-size: calc(var(--disco) * 0.185);
  letter-spacing: 0.04em;
  opacity: 0.95;
  margin-bottom: 1px;
}
.peca .disco .num {
  font-family: var(--placar);
  font-weight: 800;
  font-size: calc(var(--disco) * 0.42);
  font-variant-numeric: tabular-nums;
}
.peca.adversaria .disco {
  background: var(--visitante);
  color: #fff;
}
.peca.adversaria .disco .num { font-size: calc(var(--disco) * 0.46); }

.peca .placa {
  position: absolute;
  left: 0;
  top: 100%;
  transform: translateY(4px);
  max-width: 100px;
  padding: 2px 6px;
  background: var(--cal);
  border: 2px solid var(--contorno);
  border-radius: 5px;
  color: #11160f;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.peca[data-placa='acima'] .placa {
  top: auto;
  bottom: 100%;
  transform: translateY(-4px);
}

.peca.escolhida { z-index: 4; }
.peca.escolhida .disco {
  box-shadow: 0 0 0 4px var(--selecao), var(--sombraPeca);
}

.peca.carregando { z-index: 5; }
.peca.carregando .disco { box-shadow: var(--sombraPecaAlta); }

.peca:focus-visible { outline: none; }
.peca:focus-visible .disco {
  outline: 3px solid var(--selecao);
  outline-offset: 3px;
  box-shadow: 0 0 0 7px rgba(17, 22, 15, 0.85), var(--sombraPeca);
}

/* a faixa de capitão, no canto do disco */
.peca .faixa {
  position: absolute;
  bottom: 0;
  left: 0;
  width: calc(var(--disco) * 0.4);
  height: calc(var(--disco) * 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--selecao);
  border: 2px solid var(--contorno);
  color: #11160f;
  font-family: var(--placar);
  font-weight: 800;
  font-size: calc(var(--disco) * 0.26);
  line-height: 1;
  pointer-events: none;
}

/* de onde o jogador saiu */
#origem {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  width: var(--disco);
  height: var(--disco);
  border: 2px dashed var(--cal);
  border-radius: 50%;
  opacity: 0.85;
  pointer-events: none;
  z-index: 1;
}

/* etiqueta da modalidade e contador, dentro do campo */
.selo {
  position: absolute;
  z-index: 3;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(17, 22, 15, 0.72);
  color: var(--cal);
  font-size: 13px;
  font-weight: 700;
  pointer-events: none;
}
.selo.emCima { top: 6px; left: 6px; }
.selo.embaixo { bottom: 6px; right: 6px; }
.selo.falta { background: var(--perigo); color: #fff; }

/* ===== 03-interface.css ===== */
/* Presilha da prancheta, abas de modalidade, barra de baixo e as gavetas.
   Nada de menu escondido: todo botao tem palavra escrita. */

.tela {
  height: 100%;
  display: flex;
  align-items: stretch;
  background: var(--fundo);
}

.app {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------------------------------------------------------- presilha */

.presilha {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  background: var(--contorno);
  color: var(--cal);
}
:root[data-sol='1'] .presilha { background: #000; }

@media (max-width: 559px) {
  .presilha .marca { display: none; }
}

.presilha .marca {
  font-family: var(--placar);
  font-weight: 800;
  font-size: 19px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.presilha .nomeTime {
  flex: 1;
  min-width: 0;
  text-align: left;
  font-size: 16px;
  font-weight: 700;
  color: var(--cal);
  background: rgba(245, 247, 240, 0.14);
  border: 2px solid rgba(245, 247, 240, 0.3);
  border-radius: 8px;
  min-height: 44px;
  padding: 6px 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.presilha .btTopo {
  min-height: 46px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 2px solid rgba(245, 247, 240, 0.35);
  color: var(--cal);
  font-size: 15px;
  white-space: nowrap;
}
.presilha .btTopo[disabled] { opacity: 0.35; }
.presilha .btTopo.destaque {
  background: var(--acao);
  border-color: var(--acao);
  color: #11160f;
  font-weight: 900;
}

/* na tela do celular o cabeçalho fica no essencial */
@media (max-width: 559px) {
  .presilha .marca, .presilha .nomeTime { display: none; }
  .presilha { gap: 8px; }
}

/* ------------------------------------------- seletor de tipo de campo */
/* só o campo escolhido aparece; tocar nele abre a escolha */

.chipCampo {
  flex: 0 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.15;
  padding: 6px 12px;
  border-radius: 8px;
  border: 2px solid var(--acao);
  background: rgba(242, 92, 5, 0.16);
  color: var(--cal);
  min-height: 46px;
  text-align: left;
  white-space: nowrap;
}
.chipCampo .nomeCampo { font-size: 16px; font-weight: 900; }
.chipCampo .quantos { font-size: 11px; font-weight: 700; opacity: 0.85; }

/* ------------------------------------------------------- barra de baixo */

.barra {
  display: flex;
  gap: 8px;
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  background: var(--painel);
  border-top: 2px solid var(--divisa);
}
.barra .bt {
  flex: 1 1 0;
  min-width: 0;
  flex-direction: column;
  gap: 2px;
  min-height: 62px;
  font-size: 15px;
  line-height: 1.1;
  padding: 6px 2px;
  border-width: 2px;
  overflow-wrap: normal;
  word-break: keep-all;
}
@media (max-width: 400px) {
  .barra { gap: 5px; padding-left: 10px; padding-right: 10px; }
  .barra .bt { font-size: 13px; }
}
.barra .bt .quantos { font-size: 12px; font-weight: 700; color: var(--texto2); }
.barra .bt[aria-pressed='true'] { background: var(--acao); border-color: var(--contorno); color: #11160f; }
.barra .bt[aria-pressed='true'] .quantos { color: #11160f; }

/* ------------------------------------- barra do jogador escolhido */

.barraJogador {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 16px;
  background: var(--selecao);
  color: #11160f;
  border-top: 2px solid var(--contorno);
}
.barraJogador[hidden] { display: none; }
.barraJogador .quemEscolhido {
  flex: 1 1 140px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.barraJogador .quemEscolhido strong {
  font-size: 17px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.barraJogador .quemEscolhido span { font-size: 13px; font-weight: 700; }
.barraJogador .bt { border-color: #11160f; background: var(--painel); }
.barraJogador .bt.principal { background: var(--acao); }

/* ----------------------------------------------------- estado salvo */

.rodapeSalvo {
  padding: 0 16px 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--texto2);
  background: var(--painel);
  text-align: left;
}
.rodapeSalvo[data-falhou='1'] { color: var(--perigo); }

/* --------------------------------------------------------- gaveta */

.folha {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  max-height: 68%;
  display: flex;
  flex-direction: column;
  background: var(--painel);
  border-top: 3px solid var(--contorno);
  border-radius: 14px 14px 0 0;
  transform: translateY(101%);
  transition: transform 0.22s ease;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.folha.aberta { transform: none; }
.folha[hidden] { display: none; }
/* cadastrar jogador, ajustes e companhia precisam da tela inteira:
   numa gaveta baixa não sobra espaço para digitar */
.folha[data-alto='1'] {
  top: 0;
  max-height: none;
  border-radius: 0;
  padding-top: env(safe-area-inset-top, 0px);
}

.folhaTopo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 2px solid var(--divisa);
  background: var(--painel);
}
.folhaTopo h2 { font-size: 19px; flex: 1; min-width: 0; }
.folhaCorpo {
  padding: 14px 16px 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cortina {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(8, 14, 8, 0.45);
  border: 0;
  width: 100%;
}
.cortina[hidden] { display: none; }

/* ------------------------------------------------------------ listas */

.lista { display: flex; flex-direction: column; }
.itemLista {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--divisa);
}
.itemLista .numero {
  width: 42px;
  height: 42px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--casa);
  border: 2px solid var(--contorno);
  color: var(--cal);
  font-family: var(--placar);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.itemLista .quem { flex: 1 1 140px; min-width: 0; }
.itemLista .quem strong {
  display: block;
  font-size: 17px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.itemLista .acoes {
  display: flex;
  gap: 8px;
  flex: 1 1 100%;
  flex-wrap: wrap;
}
.itemLista .acoes > * { flex: 1 1 88px; min-height: 48px; font-size: 15px; white-space: nowrap; }

<script>
/* ===== 00-dados.js ===== */
// Dados do jogo: modalidades, medidas reais dos campos, posições,
// formações prontas e estilos de jogo.
//
// SISTEMA DE COORDENADAS (o mesmo em todo o aplicativo):
//   x = 0 na lateral esquerda, x = 100 na lateral direita
//   y = 0 na linha de fundo do NOSSO gol, y = 100 na linha de fundo do gol adversário
//   raio/medida redonda = porcentagem da LARGURA do campo
// O campo e sempre desenhado em pe (retrato), com o nosso gol embaixo,
// igual ao desenho que o treinador fez a mão.

var PJ = {};

// ---------------------------------------------------------------- posições

// `camisa` e `camisa2` são a numeração clássica do futebol brasileiro:
// 1 goleiro, 2 lateral-direito, 3 e 4 zagueiros, 5 volante, 6 lateral-
// esquerdo, 7 ponta-direita, 8 e 10 meias, 9 centroavante, 11 ponta-
// esquerda. O aplicativo usa isso só para sugerir o número ao cadastrar.
PJ.POSICOES = {
  GOL: { nome: 'Goleiro', setor: 'goleiro', camisa: 1, camisa2: 12 },
  ZAG: { nome: 'Zagueiro', setor: 'defesa', camisa: 3, camisa2: 4 },
  LE: { nome: 'Lateral-esquerdo', setor: 'defesa', camisa: 6, camisa2: 16 },
  LD: { nome: 'Lateral-direito', setor: 'defesa', camisa: 2, camisa2: 13 },
  FIXO: { nome: 'Fixo', setor: 'defesa', camisa: 3, camisa2: 4 },
  ALA: { nome: 'Ala', setor: 'meio', camisa: 7, camisa2: 11 },
  VOL: { nome: 'Volante', setor: 'meio', camisa: 5, camisa2: 8 },
  ME: { nome: 'Meia-esquerda', setor: 'meio', camisa: 11, camisa2: 10 },
  MD: { nome: 'Meia-direita', setor: 'meio', camisa: 7, camisa2: 17 },
  MEI: { nome: 'Meia', setor: 'meio', camisa: 10, camisa2: 8 },
  PE: { nome: 'Ponta-esquerda', setor: 'ataque', camisa: 11, camisa2: 20 },
  PD: { nome: 'Ponta-direita', setor: 'ataque', camisa: 7, camisa2: 17 },
  ATA: { nome: 'Atacante', setor: 'ataque', camisa: 9, camisa2: 19 },
  'PIVÔ': { nome: 'Pivô', setor: 'ataque', camisa: 9, camisa2: 19 },
};

// Descobre a sigla da posição pelo lugar onde o jogador esta no campo.
// E o que faz a etiqueta mudar sozinha quando o treinador arrasta a peca.
PJ.siglaPorLugar = function (modalidade, x, y) {
  if (modalidade === 'futsal') {
    if (y < 16) return 'GOL';
    if (y < 38) return 'FIXO';
    if (y >= 64) return 'PIVÔ';
    if (x < 32 || x > 68) return 'ALA';
    return y < 52 ? 'FIXO' : 'PIVÔ';
  }
  if (modalidade === 'society') {
    if (y < 15) return 'GOL';
    if (y < 36) return 'ZAG';
    if (y < 60) {
      if (x < 24 || x > 76) return 'ALA';
      return y < 48 ? 'VOL' : 'MEI';
    }
    if (x < 28) return 'PE';
    if (x > 72) return 'PD';
    return 'ATA';
  }
  // campo 11
  if (y < 14) return 'GOL';
  if (y < 34) {
    if (x < 22) return 'LE';
    if (x > 78) return 'LD';
    return 'ZAG';
  }
  if (y < 58) {
    if (x < 20) return 'ME';
    if (x > 80) return 'MD';
    return y < 45 ? 'VOL' : 'MEI';
  }
  if (x < 26) return 'PE';
  if (x > 74) return 'PD';
  return 'ATA';
};

// ------------------------------------------------- geometria de cada campo
// Monta a lista de tracos do campo a partir das medidas REAIS em metros.
// Devolve figuras simples que servem tanto para desenhar na tela (SVG)
// quanto para gerar a foto do campo (canvas), sem duplicar conta nenhuma.

function arcoPontos(cx, cy, raioX, raioY, grau1, grau2, passos) {
  var pontos = [];
  var n = passos || 20;
  for (var i = 0; i <= n; i++) {
    var g = (grau1 + ((grau2 - grau1) * i) / n) * (Math.PI / 180);
    pontos.push([cx + raioX * Math.cos(g), cy + raioY * Math.sin(g)]);
  }
  return pontos;
}

function geometriaCampo(m) {
  var L = m.comprimentoM;
  var W = m.larguraM;
  var px = function (metros) { return (metros / W) * 100; }; // largura -> %
  var py = function (metros) { return (metros / L) * 100; }; // comprimento -> %
  var pr = function (metros) { return (metros / W) * 100; }; // raio -> % da largura

  var f = [];
  var add = function (fig) { f.push(fig); };

  // borda e linha do meio
  add({ tipo: 'retangulo', x: 0, y: 0, largura: 100, altura: 100 });
  add({ tipo: 'linha', x1: 0, y1: 50, x2: 100, y2: 50, papel: 'meio' });
  add({ tipo: 'disco', cx: 50, cy: 50, r: pr(0.22) });

  // circulo central
  if (m.raioCentralM) {
    add({ tipo: 'circulo', cx: 50, cy: 50, r: pr(m.raioCentralM), papel: m.circuloOpcional ? 'fraco' : '' });
  }

  var lado; // -1 = nosso lado (embaixo), +1 = lado do adversário (em cima)
  for (lado = 0; lado < 2; lado++) {
    var base = lado === 0 ? 0 : 100;       // linha de fundo
    var dentro = lado === 0 ? 1 : -1;      // sentido para dentro do campo

    // gol
    var meioGol = px(m.golM) / 2;
    add({ tipo: 'gol', x1: 50 - meioGol, x2: 50 + meioGol, y: base, dentro: dentro });

    if (m.grandeAreaM) {
      var gl = px(m.grandeAreaM.larguraM) / 2;
      var gp = py(m.grandeAreaM.profundidadeM);
      add({
        tipo: 'retangulo',
        x: 50 - gl, largura: gl * 2,
        y: lado === 0 ? 0 : 100 - gp, altura: gp,
      });
    }
    if (m.pequenaAreaM) {
      var pl = px(m.pequenaAreaM.larguraM) / 2;
      var pp = py(m.pequenaAreaM.profundidadeM);
      add({
        tipo: 'retangulo',
        x: 50 - pl, largura: pl * 2,
        y: lado === 0 ? 0 : 100 - pp, altura: pp,
      });
    }

    // área do futsal: dois quartos de circulo ligados por uma reta
    if (m.areaArcoM) {
      var raio = m.areaArcoM.raioM;
      var cxEsq = 50 - px(m.areaArcoM.entrePostesM) / 2;
      var cxDir = 50 + px(m.areaArcoM.entrePostesM) / 2;
      var rx = pr(raio);
      var ry = py(raio);
      var topo = lado === 0 ? ry : 100 - ry;
      var esq = arcoPontos(cxEsq, base, rx, ry * dentro, 180, 90, 16);
      var dir = arcoPontos(cxDir, base, rx, ry * dentro, 90, 0, 16);
      add({ tipo: 'poligonal', pontos: esq });
      add({ tipo: 'linha', x1: cxEsq, y1: topo, x2: cxDir, y2: topo });
      add({ tipo: 'poligonal', pontos: dir });
    }

    // marca do pênalti
    if (m.penaltiM != null) {
      var yp = lado === 0 ? py(m.penaltiM) : 100 - py(m.penaltiM);
      add({ tipo: 'disco', cx: 50, cy: yp, r: pr(0.22) });

      // meia-lua: só a parte que fica fora da grande área
      if (m.meiaLua && m.grandeAreaM) {
        var rArco = pr(m.raioCentralM);
        var rArcoY = py(m.raioCentralM);
        var limite = lado === 0 ? py(m.grandeAreaM.profundidadeM) : 100 - py(m.grandeAreaM.profundidadeM);
        var dy = Math.abs(limite - yp);
        var ang = Math.asin(Math.min(1, dy / rArcoY)) * (180 / Math.PI);
        add({ tipo: 'poligonal', pontos: arcoPontos(50, yp, rArco, rArcoY * dentro, ang, 180 - ang, 18) });
      }
    }

    // segunda marca do futsal (10 metros)
    if (m.segundaMarcaM != null) {
      var y2 = lado === 0 ? py(m.segundaMarcaM) : 100 - py(m.segundaMarcaM);
      add({ tipo: 'disco', cx: 50, cy: y2, r: pr(0.22) });
    }

    // arcos de escanteio
    if (m.escanteioM) {
      var re = pr(m.escanteioM);
      var reY = py(m.escanteioM);
      add({ tipo: 'poligonal', pontos: arcoPontos(0, base, re, reY * dentro, 0, 90, 8) });
      add({ tipo: 'poligonal', pontos: arcoPontos(100, base, re, reY * dentro, 90, 180, 8) });
    }

    // marcas de saída do society
    if (m.marcaSaidaM) {
      var ys = lado === 0 ? 50 - py(m.marcaSaidaM.distanciaM) : 50 + py(m.marcaSaidaM.distanciaM);
      var meia = px(m.marcaSaidaM.comprimentoM) / 2;
      add({ tipo: 'linha', x1: 50 - meia, y1: ys, x2: 50 + meia, y2: ys });
    }
  }
  return f;
}

// ------------------------------------------------------------- modalidades

PJ.MODALIDADES = {
  campo11: {
    id: 'campo11',
    nome: 'Campo 11',
    nomeLongo: 'Futebol de campo',
    emCampo: 11,
    comprimentoM: 105,
    larguraM: 68,
    golM: 7.32,
    raioCentralM: 9.15,
    penaltiM: 11,

    escanteioM: 1,
    grandeAreaM: { profundidadeM: 16.5, larguraM: 40.32 },
    pequenaAreaM: { profundidadeM: 5.5, larguraM: 18.32 },
    superficie: 'grama',
    formacoes: [
      { id: 'c11-4-4-2', nome: '4-4-2', explicacao: 'Duas fileiras de quatro e dois na frente. Cada um marca quem está na sua frente: é o mais fácil de explicar para o time.', jogadores: [['GOL', 50, 5], ['LE', 10, 20], ['ZAG', 36, 18], ['ZAG', 64, 18], ['LD', 90, 20], ['ME', 10, 46], ['VOL', 38, 42], ['MEI', 62, 42], ['MD', 90, 46], ['ATA', 35, 78], ['ATA', 65, 78]] },

// O desenho de fábrica das formações nasce esticado demais: 60 pontos entre
// o zagueiro e o atacante são 63 metros de campo, e nenhum time joga assim.
// O bloco de verdade tem 30 a 40 metros. Aperta o bloco uma vez, guardando
// o formato e a simetria — de quebra, afasta o zagueiro do goleiro.
function apertarBloco(m, fator) {
  m.formacoes.forEach(function (f) {
    var naLinha = function (j) { return f.goleiroNaLinha || j[0] !== 'GOL'; };
    var linha = f.jogadores.filter(naLinha);
    if (!linha.length) return;
    var cy = linha.reduce(function (soma, j) { return soma + j[2]; }, 0) / linha.length;
    f.jogadores.forEach(function (j) {
      if (!naLinha(j)) return;
      var y = cy + (j[2] - cy) * fator;
      j[2] = Math.round(Math.max(8, Math.min(m.alturaMaxima, y)) * 10) / 10;
    });
  });
}

// Guarda a geometria pronta de cada campo (calculada uma vez só).
PJ.ORDEM_MODALIDADES.forEach(function (id) {

  m.figuras = geometriaCampo(m);
  m.proporcao = m.larguraM / m.comprimentoM;      // largura / altura
  m.alturaVB = (m.comprimentoM / m.larguraM) * 100; // altura do viewBox do SVG
});

// Monta a escalação inicial de uma modalidade a partir de uma formação.
function escalarDaFormacao(modalidade, formacao, elenco) {
  var emCampo = [];
  for (var i = 0; i < formacao.jogadores.length && i < elenco.length; i++) {
    var slot = formacao.jogadores[i];
    emCampo.push({ id: elenco[i].id, x: slot[1], y: slot[2] });
    if (!elenco[i].posicao) elenco[i].posicao = slot[0];
  }
  return emCampo;
}

function campoVazio(idModalidade, elenco) {
  var m = PJ.MODALIDADES[idModalidade];
  var f = m.formacoes[0];
  return {
    emCampo: escalarDaFormacao(idModalidade, f, elenco),
    formacao: f.id,
    estilo: 'padrao',
    setas: [],
    adversarios: [],
  };
}

PJ.estadoNovo = function () {
  var base = PJ.MODALIDADES.campo11.formacoes[0].jogadores;
  var banco = ['GOL', 'ZAG', 'LD', 'MEI', 'ATA'];   // posições dos reservas
  var elenco = PJ.ELENCO_EXEMPLO.map(function (j, i) {
    return {
      id: 'j' + (i + 1), numero: j.numero, nome: j.nome,
      posicao: base[i] ? base[i][0] : (banco[i - base.length] || 'MEI'),
      exemplo: true,
    };
  });
  var e = {
    versao: 1,
    proximoId: elenco.length,
    exemplo: true,
    nomeTime: 'Meu Time',
    modalidade: 'campo11',
    tela: 'auto',

  };
  PJ.ORDEM_MODALIDADES.forEach(function (id) {
    e.campos[id] = campoVazio(id, elenco);
